<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
/*
 * rose-sync.js — 本地优先同步核心库
 */
var JB = {
  BINS: {
    accounts: 'accounts',
    technicians: 'technicians',
    notices: 'notices',
    audit_log: 'audit_log',
    village_heads: 'village_heads',
    villagers: 'villagers',
    supermarkets: 'supermarkets',
    markets: 'markets',
    factories: 'factories',
    customer_service: 'customer_service',
    sales_managers: 'sales_managers',
    village_agents: 'village_agents',
    town_agents: 'town_agents',
    county_agents: 'county_agents'
  },
  _adapterNow: function () {
    try { return (typeof window !== 'undefined' && window.RoseSyncAdapter) ? window.RoseSyncAdapter : null; }
    catch (e) { return null; }
  },
  _storageKey: function (binKey) { return 'rose_' + binKey; },
  _unwrap: function (v) {
    var depth = 0;
    while (depth < 5 && v && typeof v === 'object' && 'record' in v && Object.keys(v).length <= 2) { v = v.record; depth++; }
    return v;
  },
  _getLocal: function (binKey) {
    try {
      var v = localStorage.getItem(this._storageKey(binKey));
      if (!v) return [];
      return this._unwrap(JSON.parse(v));
    } catch (e) { return []; }
  },
  _setLocal: function (binKey, data) {
    try {
      localStorage.setItem(this._storageKey(binKey), JSON.stringify(data));
      return true;
    } catch (e) {
      if (typeof toast === 'function') toast('本地存储已满，请清理浏览器缓存');
      return false;
    }
  },
  _mergeLists: function (localArr, cloudArr, binKey) {
    var self = this;
    var delSet = {};
    if (binKey) self.getDeleted(binKey).forEach(function (id) { delSet[id] = true; });
    var map = {}, noKey = [];
    function ts(it) { return (it && (it.updateTime || it.time || it.registerTime)) || 0; }
    function keyOf(it) { return it && (it.id || it.account || it.accountId); }
    function isDel(it) { var k = keyOf(it); return k && delSet[k]; }
    function add(it) {
      if (!it || typeof it !== "object") return;
      if (isDel(it)) return;
      var k = keyOf(it);
      if (!k) { noKey.push(it); return; }
      if (!map[k]) map[k] = [it, ts(it)];
      else if (ts(it) > map[k][1]) map[k] = [it, ts(it)];
    }
    (Array.isArray(cloudArr) ? cloudArr : []).forEach(add);
    (Array.isArray(localArr) ? localArr : []).forEach(add);
    var out = [];
    Object.keys(map).forEach(function (k) { out.push(map[k][0]); });
    return out.concat(noKey);
  },
  get: function (binKey, cb) {
    var self = this;
    var local = this._getLocal(binKey);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.pull === "function") {
      var settled = false;
      var finish = function (cloudArr, ok) {
        if (settled) return; settled = true;
        if (ok && Array.isArray(cloudArr)) {
          var merged = self._mergeLists(local, cloudArr, binKey);
          self._setLocal(binKey, merged);
          cb(merged, true, cloudArr);
        } else {
          cb(local, false, local);
        }
      };
      adapter.pull(binKey, finish);
      setTimeout(function () { finish(local, false); }, 2500);
    } else {
      setTimeout(function () { cb(local, true, local); }, 0);
    }
  },
  put: function (binKey, data, cb) {
    this._setLocal(binKey, data);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.push === "function") {
      var settled = false;
      var finish = function (ok) { if (settled) return; settled = true; if (typeof cb === "function") cb(ok); };
      adapter.push(binKey, data, finish);
      setTimeout(function () { finish(false); }, 2500);
    } else {
      if (typeof cb === "function") setTimeout(function () { cb(true); }, 0);
    }
  },
  syncAll: function (cb) {
    var adapter = this._adapterNow();
    if (!adapter) { if (typeof cb === "function") cb(true); return; }
    var self = this, keys = ["accounts", "technicians", "notices", "audit_log"], pending = keys.length;
    function done() { pending--; if (pending <= 0 && typeof cb === "function") cb(true); }
    keys.forEach(function (k) {
      var snapshot = self._getLocal(k);
      self.get(k, function (mergedArr, ok, rawArr) {
        if (!ok) { done(); return; }
        if (!Array.isArray(rawArr)) rawArr = [];
        var merged = self._mergeLists(snapshot, rawArr, k);
        var same = JSON.stringify(merged) === JSON.stringify(rawArr);
        if (same) done();
        else self.put(k, merged, function () { done(); });
      });
    });
  },
  getCurrentUser: function () {
    try { var raw = localStorage.getItem("rose_current_user"); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  genId: function () {
    var ts = Date.now().toString(36);
    var r1 = Math.random().toString(36).slice(2);
    var r2 = "";
    try { r2 = crypto.getRandomValues(new Uint32Array(1))[0].toString(36); }
    catch (e) { r2 = Math.random().toString(36).slice(2); }
    return ts + r1 + r2;
  },
  _deletedKey: function (binKey) { return 'rose_deleted_' + binKey; },
  getDeleted: function (binKey) {
    try { return JSON.parse(localStorage.getItem(this._deletedKey(binKey)) || "[]"); } catch (e) { return []; }
  },
  markDeleted: function (binKey, id) {
    if (!id) return;
    var d = this.getDeleted(binKey);
    if (d.indexOf(id) < 0) d.push(id);
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  },
  unmarkDeleted: function (binKey, id) {
    var d = this.getDeleted(binKey).filter(function (x) { return x !== id; });
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  }
};
setTimeout(function () { try { JB.syncAll(); } catch (e) {} }, 800);
window.onerror = function (m, s, l, c) {
  try {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap;";
    d.textContent = "页面报错: " + m + " (" + l + ":" + c + ")";
    (document.body || document.documentElement).appendChild(d);
  } catch (e) {}
  return false;
};
  </script>

<script>
var ADMIN_PWD = 'admin123';
var LOG_KEY = 'audit_log';
var NOTICE_KEY = 'notices';
var cloudOk = false;

var ROLE_CONFIG = {
  technician: { name: '技师', icon: '💆', bin: 'technicians' },
  village_head: { name: '村长', icon: '🏘️', bin: 'village_heads' },
  villager: { name: '村民', icon: '🧑‍🌾', bin: 'villagers' },
  supermarket: { name: '超市', icon: '🏪', bin: 'supermarkets' },
  market: { name: '农贸市场', icon: '🥬', bin: 'markets' },
  factory: { name: '企业工厂', icon: '🏭', bin: 'factories' },
  customer_service: { name: '客服', icon: '🎧', bin: 'customer_service' },
  sales_manager: { name: '销售经理', icon: '📊', bin: 'sales_managers' },
  village_agent: { name: '村级代理', icon: '📍', bin: 'village_agents' },
  town_agent: { name: '镇级代理', icon: '📌', bin: 'town_agents' },
  county_agent: { name: '县级代理', icon: '🗺️', bin: 'county_agents' }
};

var ALL_ROLE_KEYS = Object.keys(ROLE_CONFIG);
var currentAdminTab = 'review';
var currentRoleFilter = 'all';
var allLoadedData = {}; // binKey -> []
var allPendingItems = [];

function toast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2200);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function switchAdminTab(name) {
  currentAdminTab = name;
  var panels = { review:'reviewPanel', history:'historyPanel', all:'allPanel', notice:'noticePanel' };
  var tabs = { review:'tabReview', history:'tabHistory', all:'tabAll', notice:'tabNotice' };
  Object.keys(panels).forEach(function(k){
    var p = document.getElementById(panels[k]);
    if (p) p.style.display = (k === name) ? 'block' : 'none';
    var t = document.getElementById(tabs[k]);
    if (t) {
      if (k === name) { t.classList.add('active'); t.style.color = '#c2185b'; t.style.borderBottomColor = '#c2185b'; }
      else { t.classList.remove('active'); t.style.color = '#666'; t.style.borderBottomColor = 'transparent'; }
    }
  });
  var roleBar = document.getElementById('roleTabBar');
  if (roleBar) roleBar.style.display = (name === 'review' || name === 'all') ? 'flex' : 'none';
  if (name === 'all') renderAllPanel();
  else if (name === 'history') renderHistoryPanel();
  else if (name === 'notice') loadNotices();
  else renderReviewPanel();
}

function formatTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function setCloudBadge(ok, text) {
  try {
    var badge = document.getElementById('cloudBadge');
    if (badge) { badge.style.display = 'inline-block'; badge.className = ok ? 'cloud-badge' : 'cloud-badge offline'; badge.textContent = text || (ok ? '云端已连接' : '本地模式'); }
    var s2 = document.getElementById('adminCloudStatus');
    if (s2) { s2.textContent = ok ? '已连接' : '本地模式'; s2.style.color = ok ? '#2E7D32' : '#FF9800'; }
  } catch (e) {}
}

function adminLogin() {
  var pwd = document.getElementById('adminPwd').value;
  if (pwd === ADMIN_PWD) {
    try { localStorage.setItem('rose_admin_logged', '1'); } catch(e) {}
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('adminView').style.display = 'block';
    renderRoleTabBar();
    loadAll();
  } else {
    toast('密码错误');
  }
}

function adminLogout() {
  if (confirm('确定退出？')) {
    try { localStorage.removeItem('rose_admin_logged'); } catch(e) {}
    location.reload();
  }
}

function renderRoleTabBar() {
  var bar = document.getElementById('roleTabBar');
  var allItems = [];
  ALL_ROLE_KEYS.forEach(function(k) {
    var items = allLoadedData[ROLE_CONFIG[k].bin] || [];
    items.forEach(function(item) { item._bin = ROLE_CONFIG[k].bin; item._role = k; });
    allItems = allItems.concat(items);
  });
  var pending = allItems.filter(function(t) { return t.status === '待审核'; });
  var html = '<div class="role-tab' + (currentRoleFilter === 'all' ? ' active' : '') + '" onclick="filterRoleTab(\'all\')">全部 <span class="count">' + pending.length + '</span></div>';
  ALL_ROLE_KEYS.forEach(function(key) {
    var cfg = ROLE_CONFIG[key];
    var count = pending.filter(function(t) { return t._role === key; }).length;
    if (count === 0) return;
    html += '<div class="role-tab' + (currentRoleFilter === key ? ' active' : '') + '" onclick="filterRoleTab(\'' + key + '\')"><span class="role-emoji">' + cfg.icon + '</span> ' + cfg.name + ' <span class="count">' + count + '</span></div>';
  });
  bar.innerHTML = html;
}

function filterRoleTab(role) {
  currentRoleFilter = role;
  renderRoleTabBar();
  if (currentAdminTab === 'review') renderReviewPanel();
  else if (currentAdminTab === 'all') renderAllPanel();
}

function loadAll() {
  document.getElementById('pendingList').innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('historyList').innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('allList').innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('noticeList').innerHTML = '<div class="loading">加载中...</div>';

  allLoadedData = {};
  allPendingItems = [];
  var loaded = 0;
  var total = ALL_ROLE_KEYS.length + 2; // 所有角色 + accounts + notices

  function checkAll() {
    if (++loaded === total) {
      renderRoleTabBar();
      updateCounts();
      if (currentAdminTab === 'review') renderReviewPanel();
      else if (currentAdminTab === 'history') renderHistoryPanel();
      else if (currentAdminTab === 'all') renderAllPanel();
      else if (currentAdminTab === 'notice') loadNotices();
    }
  }

  ALL_ROLE_KEYS.forEach(function(key) {
    var binKey = ROLE_CONFIG[key].bin;
    JB.get(binKey, function(data) {
      allLoadedData[binKey] = Array.isArray(data) ? data : [];
      (Array.isArray(data) ? data : []).forEach(function(item) {
        item._bin = binKey;
        item._role = key;
        if (item.status === '待审核') allPendingItems.push(item);
      });
      checkAll();
    });
  });

  JB.get(LOG_KEY, function(data) {
    allLoadedData[LOG_KEY] = Array.isArray(data) ? data : [];
    checkAll();
  });
  JB.get(NOTICE_KEY, function(data) {
    allLoadedData[NOTICE_KEY] = Array.isArray(data) ? data : [];
    checkAll();
  });
}

function updateCounts() {
  try {
    var pending = allPendingItems;
    var pc = document.getElementById('pendingCount');
    var hc = document.getElementById('historyCount');
    var ac = document.getElementById('allCount');
    var nc = document.getElementById('noticeCount');
    if (pc) pc.textContent = pending.length ? '(' + pending.length + ')' : '';
    if (hc) hc.textContent = (allLoadedData[LOG_KEY] || []).length ? '(' + allLoadedData[LOG_KEY].length + ')' : '';
    var allItems = [];
    ALL_ROLE_KEYS.forEach(function(k) { allItems = allItems.concat(allLoadedData[ROLE_CONFIG[k].bin] || []); });
    var nonDeleted = allItems.filter(function(t) { return t.status !== '已撤销'; });
    if (ac) ac.textContent = nonDeleted.length ? '(' + nonDeleted.length + ')' : '';
    if (nc) nc.textContent = (allLoadedData[NOTICE_KEY] || []).length ? '(' + allLoadedData[NOTICE_KEY].length + ')' : '';
  } catch (e) {}
}

function getItemTitle(item) {
  var r = item._role || 'technician';
  if (r === 'technician') return item.name || '技师';
  if (r === 'village_head') return (item.name || '村长') + '（村长）';
  if (r === 'villager') return item.name || '村民';
  if (r === 'supermarket') return item.marketName || item.name || '超市';
  if (r === 'market') return item.marketName || item.name || '农贸市场';
  if (r === 'factory') return item.factoryName || item.name || '企业工厂';
  if (r === 'customer_service') return (item.name || '客服') + '（客服）';
  if (r === 'sales_manager') return (item.name || '销售经理') + '（销售经理）';
  if (r === 'village_agent') return item.agentName || item.name || '村级代理';
  if (r === 'town_agent') return item.agentName || item.name || '镇级代理';
  if (r === 'county_agent') return item.agentName || item.name || '县级代理';
  return item.name || r;
}

function getItemSub(item) {
  var parts = [];
  if (item.province || item.city || item.county) parts.push([item.province, item.city, item.county].filter(Boolean).join(''));
  if (item.village) parts.push(item.village + '村');
  if (item.town) parts.push(item.town + '镇');
  if (item.address) parts.push(item.address);
  return parts.join(' · ') || '未填地址';
}

function getItemExtra(item) {
  var r = item._role || 'technician';
  if (r === 'technician') return '¥' + (item.price || '?') + ' / 次';
  if (r === 'villager') {
    var extras = [];
    if (item.products && item.products.length) extras.push('农产品' + item.products.length + '种');
    if (item.crafts && item.crafts.length) extras.push('手工' + item.crafts.length + '种');
    if (item.skills && item.skills.length) extras.push('技能' + item.skills.length + '项');
    if (item.jobStatus) extras.push(item.jobStatus);
    return extras.join(' · ') || '';
  }
  if (r === 'factory') {
    var fExtras = [];
    if (item.jobs && item.jobs.length) fExtras.push('招工' + item.jobs.length + '岗');
    if (item.farmDemand) fExtras.push('需农产品');
    return fExtras.join(' · ') || '';
  }
  if (r === 'town_agent' || r === 'county_agent') {
    var aExtras = [];
    if (item.developedCount) aExtras.push('发展' + item.developedCount + '人');
    if (item.developedFactoriesCount) aExtras.push('发展' + item.developedFactoriesCount + '家');
    return aExtras.join(' · ') || '';
  }
  if (r === 'village_agent') return item.developedCount ? '发展' + item.developedCount + '人' : '';
  return '';
}

function getRoleIcon(role) {
  var cfg = ROLE_CONFIG[role];
  return cfg ? cfg.icon : '👤';
}

function getRoleName(role) {
  var cfg = ROLE_CONFIG[role];
  return cfg ? cfg.name : role;
}

function renderCardAdmin(item, showButtons, showDelete, showTop) {
  var imgs = (item.photos || []).map(function(p) { return '<img src="' + p + '" onerror="imgErr(this)">'; }).join('');
  var statusColor = item.status === '已通过' ? '#2E7D32' : item.status === '已拒绝' ? '#F44336' : '#FF9800';
  var role = item._role || 'technician';
  var roleBadge = '<span style="background:#fce4ec;color:#C2185B;font-size:11px;padding:1px 6px;border-radius:20px;margin-right:4px;">' + getRoleIcon(role) + ' ' + getRoleName(role) + '</span>';
  var title = getItemTitle(item);
  var sub = getItemSub(item);
  var extra = getItemExtra(item);
  var btns = '';
  if (showButtons) {
    btns = '<div class="row-btns"><button class="btn btn-pass btn-sm" onclick="doAudit(\'' + item.id + '\',\'' + item._bin + '\',\'approve\')">✅ 通过</button><button class="btn btn-reject btn-sm" onclick="doAudit(\'' + item.id + '\',\'' + item._bin + '\',\'reject\')">❌ 拒绝</button></div>';
  }
  if (showDelete) {
    btns += '<div class="row-btns" style="margin-top:6px;"><button class="btn btn-sm" style="background:#9E9E9E;color:#fff;" onclick="delItem(\'' + item.id + '\',\'' + item._bin + '\')">🗑 删除</button>';
    if (showTop) {
      var topBtn = item.top ? '<button class="btn btn-sm" style="background:#FF9800;color:#fff;" onclick="topItem(\'' + item.id + '\',\'' + item._bin + '\')">取消置顶</button>' : '<button class="btn btn-sm" style="background:#FF9800;color:#fff;" onclick="topItem(\'' + item.id + '\',\'' + item._bin + '\')">置顶</button>';
      btns += topBtn;
    }
    btns += '</div>';
  }
  return '<div class="card"><div class="tech-imgs">' + (imgs || '<div style="color:#bbb;font-size:12px;padding:8px;">无照片</div>') + '</div>' +
    '<div class="tech-field"><b>姓名：</b>' + escapeHtml(title) + ' ' + roleBadge + ' <span style="color:' + statusColor + ';font-size:12px;">[' + escapeHtml(item.status || '待审核') + ']</span></div>' +
    '<div class="tech-field"><b>电话：</b>' + escapeHtml(item.phone || '未填') + '</div>' +
    '<div class="tech-field"><b>地址：</b>' + escapeHtml(sub) + '</div>' +
    (extra ? '<div class="tech-field"><b>信息：</b>' + escapeHtml(extra) + '</div>' : '') +
    '<div class="tech-field" style="color:#888;"><b>账号：</b>' + escapeHtml(item.account || '') + '</div>' +
    '<div class="tech-field" style="color:#888;"><b>提交：</b>' + formatTime(item.submitTime) + '</div>' +
    btns + '</div>';
}

function renderReviewPanel() {
  var box = document.getElementById('pendingList');
  var filtered = allPendingItems;
  if (currentRoleFilter !== 'all') {
    filtered = filtered.filter(function(t) { return t._role === currentRoleFilter; });
  }
  if (filtered.length === 0) {
    box.innerHTML = '<div class="empty">⭐ 暂无待审核申请</div>';
    return;
  }
  box.innerHTML = filtered.map(function(t) { return renderCardAdmin(t, true, false); }).join('');
}

function renderAllPanel() {
  var box = document.getElementById('allList');
  var allItems = [];
  ALL_ROLE_KEYS.forEach(function(key) {
    var items = (allLoadedData[ROLE_CONFIG[key].bin] || []).filter(function(t) { return t.status !== '已撤销'; });
    items.forEach(function(item) { item._bin = ROLE_CONFIG[key].bin; item._role = key; });
    allItems = allItems.concat(items);
  });
  var filtered = allItems;
  if (currentRoleFilter !== 'all') {
    filtered = filtered.filter(function(t) { return t._role === currentRoleFilter; });
  }
  if (filtered.length === 0) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  // 置顶优先
  filtered.sort(function(a,b) { var at=a.top||0,bt=b.top||0; if(at&&bt)return bt-at; if(at)return-1; if(bt)return 1; return 0; });
  box.innerHTML = filtered.map(function(t) { return renderCardAdmin(t, false, true, true); }).join('');
}

function doAudit(id, binKey, action) {
  var list = allLoadedData[binKey] || [];
  var item = null, idx = -1;
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) { item = list[i]; idx = i; break; }
  }
  if (!item) { toast('未找到该记录'); return; }
  item.status = action === 'approve' ? '已通过' : '已拒绝';
  item.auditTime = Date.now();
  item.updateTime = Date.now();
  list[idx] = item;
  allLoadedData[binKey] = list;
  JB._setLocal(binKey, list);
  // 立即重渲染
  renderReviewPanel();
  renderAllPanel();
  updateCounts();
  toast(action === 'approve' ? '已通过 ✓' : '已拒绝 ✗');
  // 推云端
  var delays = [1500, 4000, 9000], attempt = 0;
  (function tryPush() {
    JB.put(binKey, list, function(ok) {
      if (ok) { setCloudBadge(true, '云端已连接'); return; }
      if (attempt < delays.length) { var w = delays[attempt]; attempt++; setCloudBadge(false, '重试同步中...'); setTimeout(tryPush, w); }
      else { setCloudBadge(false, '本地模式'); }
    });
  })();
  // 写审核日志
  var logs = allLoadedData[LOG_KEY] || [];
  logs.unshift({ id: item.id, name: getItemTitle(item), phone: item.phone, account: item.account || '', action: action === 'approve' ? '通过' : '拒绝', role: item._role, time: Date.now() });
  if (logs.length > 500) logs = logs.slice(0, 500);
  allLoadedData[LOG_KEY] = logs;
  JB._setLocal(LOG_KEY, logs);
  JB.put(LOG_KEY, logs, function() {});
  renderHistoryPanel();
}

function delItem(id, binKey) {
  if (!confirm('确定删除？删除后不再展示')) return;
  JB.markDeleted(binKey, id);
  var list = allLoadedData[binKey] || [];
  list = list.filter(function(t) { return t.id !== id; });
  allLoadedData[binKey] = list;
  JB._setLocal(binKey, list);
  toast('已删除 ✓');
  renderAllPanel();
  updateCounts();
  var delays = [3000, 6000, 12000], attempt = 0;
  (function tryPush() {
    JB.put(binKey, list, function(ok) {
      if (ok) { setCloudBadge(true, '云端已连接'); return; }
      if (attempt < delays.length) { var w = delays[attempt]; attempt++; setTimeout(tryPush, w); }
      else { setCloudBadge(false, '本地模式'); }
    });
  })();
}

function topItem(id, binKey) {
  var list = allLoadedData[binKey] || [];
  var item = null, idx = -1;
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) { item = list[i]; idx = i; break; } }
  if (!item) { toast('未找到'); return; }
  if (item.top) { delete item.top; toast('已取消置顶'); }
  else { item.top = Date.now(); toast('已置顶'); }
  list[idx] = item;
  allLoadedData[binKey] = list;
  JB._setLocal(binKey, list);
  renderAllPanel();
  var delays = [3000, 6000, 12000], attempt = 0;
  (function tryPush() {
    JB.put(binKey, list, function(ok) {
      if (ok) setCloudBadge(true, '云端已连接');
      else if (attempt < delays.length) { var w = delays[attempt++]; setTimeout(tryPush, w); }
      else setCloudBadge(false, '本地模式');
    });
  })();
}

function renderHistoryPanel() {
  var box = document.getElementById('historyList');
  var logs = allLoadedData[LOG_KEY] || [];
  if (logs.length === 0) { box.innerHTML = '<div class="empty">暂无审核记录</div>'; return; }
  box.innerHTML = logs.map(function(e) {
    var borderCls = e.action === '通过' ? '' : ' hist-reject';
    var roleBadge = e.role ? '<span style="background:#fce4ec;color:#C2185B;font-size:11px;padding:0 4px;border-radius:10px;margin-right:4px;">' + (ROLE_CONFIG[e.role] ? ROLE_CONFIG[e.role].icon : '') + '</span>' : '';
    return '<div class="card hist-item' + borderCls + '"><div class="hist-name">' + roleBadge + escapeHtml(e.name || '') + ' 【' + escapeHtml(e.action) + '】</div><div class="hist-meta">电话：' + escapeHtml(e.phone || '') + ' | 账号：' + escapeHtml(e.account || '') + '</div><div class="hist-meta">' + formatTime(e.time) + '</div></div>';
  }).join('');
}

function loadNotices() {
  var list = allLoadedData[NOTICE_KEY] || [];
  renderNotices(list);
}

function previewNoticeImg(input, boxId) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var box = document.getElementById(boxId);
    box.innerHTML = '<img src="' + e.target.result + '" style="width:72px;height:72px;object-fit:cover;" onerror="imgErr(this)">';
  };
  reader.readAsDataURL(file);
}

function addNotice() {
  var title = document.getElementById('noticeTitle').value.trim();
  var content = document.getElementById('noticeContent').value.trim();
  if (!title || !content) { toast('请填写标题和内容'); return; }
  toast('正在发布...');
  var imgs = [];
  for (var i = 1; i <= 3; i++) {
    var box = document.getElementById('nImg' + i + 'Box');
    var img = box ? box.querySelector('img') : null;
    if (img) imgs.push(img.src);
  }
  var list = allLoadedData[NOTICE_KEY] || [];
  var newNotice = { id: JB.genId(), title: title, content: content, photos: imgs, time: Date.now() };
  list.unshift(newNotice);
  allLoadedData[NOTICE_KEY] = list;
  JB._setLocal(NOTICE_KEY, list);
  renderNotices(list);
  document.getElementById('noticeTitle').value = '';
  document.getElementById('noticeContent').value = '';
  for (var j = 1; j <= 3; j++) { document.getElementById('nImg' + j + 'Box').innerHTML = '+'; }
  updateCounts();
  var delays = [3000, 6000, 12000], attempt = 0;
  (function tryPush() {
    JB.put(NOTICE_KEY, list, function(ok) {
      if (ok) { setCloudBadge(true, '云端已连接'); toast('公告已发布 ✓'); }
      else if (attempt < delays.length) { var w = delays[attempt++]; setTimeout(tryPush, w); }
      else { setCloudBadge(false, '本地模式'); toast('已保存，联网后自动同步'); }
    });
  })();
}

function renderNotices(list) {
  var box = document.getElementById('noticeList');
  if (list.length === 0) { box.innerHTML = '<div class="empty">暂无公告</div>'; return; }
  box.innerHTML = list.map(function(n) {
    var photosHtml = '';
    if (n.photos && n.photos.length > 0) {
      photosHtml = '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;">';
      for (var pi = 0; pi < n.photos.length; pi++) {
        photosHtml += '<img src="' + n.photos[pi] + '" style="width:72px;height:72px;object-fit:cover;border-radius:8px;" onerror="imgErr(this)">';
      }
      photosHtml += '</div>';
    }
    return '<div class="card notice-item"><div style="flex:1;"><b style="font-size:15px;">' + escapeHtml(n.title) + '</b><div style="font-size:13px;color:#555;margin-top:6px;white-space:pre-wrap;line-height:1.5;">' + escapeHtml(n.content) + '</div>' + photosHtml + '<div style="font-size:11px;color:#bbb;margin-top:8px;">' + formatTime(n.time) + '</div></div><div style="display:flex;gap:12px;white-space:nowrap;"><div class="notice-del" style="color:#FF9800;" onclick="republishNotice(\'' + n.id + '\')">重新发布</div><div class="notice-del" onclick="delNotice(\'' + n.id + '\')">删除</div></div></div>';
  }).join('');
}

function republishNotice(id) {
  var list = allLoadedData[NOTICE_KEY] || [];
  var n = null, ni = -1;
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) { n = list[i]; ni = i; break; } }
  if (!n) { toast('未找到该公告'); return; }
  n.time = Date.now();
  list.splice(ni, 1); list.unshift(n);
  allLoadedData[NOTICE_KEY] = list;
  JB._setLocal(NOTICE_KEY, list);
  renderNotices(list);
  var delays = [3000, 6000, 12000], attempt = 0;
  (function tryPush() {
    JB.put(NOTICE_KEY, list, function(ok) {
      if (ok) { setCloudBadge(true, '云端已连接'); toast('已重新发布'); }
      else if (attempt < delays.length) { var w = delays[attempt++]; setTimeout(tryPush, w); }
      else { setCloudBadge(false, '本地模式'); toast('已保存'); }
    });
  })();
}

function delNotice(id) {
  if (!confirm('确定删除该公告？')) return;
  JB.markDeleted(NOTICE_KEY, id);
  var list = allLoadedData[NOTICE_KEY] || [];
  list = list.filter(function(n) { return n.id !== id; });
  allLoadedData[NOTICE_KEY] = list;
  JB._setLocal(NOTICE_KEY, list);
  toast('已删除');
  renderNotices(list);
  updateCounts();
  var delays = [3000, 6000, 12000], attempt = 0;
  (function tryPush() {
    JB.put(NOTICE_KEY, list, function(ok) {
      if (ok) setCloudBadge(true, '云端已连接');
      else if (attempt < delays.length) { var w = delays[attempt++]; setTimeout(tryPush, w); }
      else setCloudBadge(false, '本地模式');
    });
  })();
}

function toggleAdminCloudInput() {
  var el = document.getElementById('adminCloudInput');
  if (!el) return;
  if (el.style.display === 'none') { el.style.display = 'block'; var ti = document.getElementById('adminTokenInput'); if (ti) ti.focus(); }
  else { el.style.display = 'none'; }
}
function saveAdminCloud() {
  var t = document.getElementById('adminTokenInput').value.trim();
  var msg = document.getElementById('adminCloudMsg');
  if (!t) { if (msg) { msg.style.color = '#c62828'; msg.textContent = '请输入 Token'; } return; }
  if (msg) { msg.style.color = '#1565C0'; msg.textContent = '正在验证 Token…'; }
  fetch('https://api.github.com/repos/chenhaijun20260824/baihe-data', {
    headers: { 'Authorization': 'token ' + t, 'Accept': 'application/vnd.github+json' }
  })
  .then(function(r) {
    if (r.status === 200) return r.json();
    if (r.status === 401) throw new Error('Token 无效或已过期');
    if (r.status === 404) throw new Error('无仓库访问权限');
    throw new Error('HTTP ' + r.status);
  })
  .then(function() {
    var cfg = { token: t, owner: 'chenhaijun20260824', repo: 'baihe-data', branch: 'main', path: 'data' };
    try { localStorage.setItem('百合_cloud_cfg', JSON.stringify(cfg)); } catch(e) {}
    if (msg) { msg.style.color = '#2E7D32'; msg.textContent = '已保存 ✓ 正在刷新…'; }
    setTimeout(function(){ location.reload(); }, 900);
  })
  .catch(function(e) {
    if (msg) { msg.style.color = '#c62828'; msg.textContent = (e && e.message ? e.message : e); }
  });
}

(function checkCloud() {
  JB.get('accounts', function(data) {
    cloudOk = Array.isArray(data);
    setCloudBadge(cloudOk, cloudOk ? '云端已连接' : '本地模式');
  });
})();

var _adminLogged = false;
try { _adminLogged = localStorage.getItem('rose_admin_logged') === '1'; } catch(e) { _adminLogged = false; }
if (_adminLogged) {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('adminView').style.display = 'block';
  renderRoleTabBar();
  loadAll();
}
</script>
