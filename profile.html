<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
/*
 * rose-sync.js — 本地优先同步核心库（取代 jsonbin.js）
 * 架构：本地优先（localStorage 永远可用），可选接入轻量后端做多端同步。
 * 默认不接任何云端：零额度、零网络依赖、不会弹"密钥失败"红条。
 * 多端同步：给 window.RoseSyncAdapter 赋值适配器即可（见 local-api.js 示例）。
 */
var JB = {
  BINS: { accounts: 'accounts', technicians: 'technicians', notices: 'notices', audit_log: 'audit_log' },
  _adapterNow: function () {
    try { return (typeof window !== 'undefined' && window.RoseSyncAdapter) ? window.RoseSyncAdapter : null; }
    catch (e) { return null; }
  },
  _storageKey: function (binKey) { return 'rose_' + binKey; },
  _unwrap: function (v) {
    var depth = 0;
    while (depth < 5 && v && typeof v === 'object' && 'record' in v && Object.keys(v).length <= 2) { v = v.record; depth++; }
    return v;
  },
  _getLocal: function (binKey) {
    try {
      var v = localStorage.getItem(this._storageKey(binKey));
      if (!v) return [];
      return this._unwrap(JSON.parse(v));
    } catch (e) { return []; }
  },
  _setLocal: function (binKey, data) {
    try {
      localStorage.setItem(this._storageKey(binKey), JSON.stringify(data));
      return true;
    } catch (e) {
      if (typeof toast === 'function') toast('本地存储已满，请清理浏览器缓存');
      return false;
    }
  },
  _mergeLists: function (localArr, cloudArr, binKey) {
    var self = this;
    var delSet = {};
    if (binKey) self.getDeleted(binKey).forEach(function (id) { delSet[id] = true; });
    var map = {}, noKey = [];
    function ts(it) { return (it && (it.updateTime || it.time || it.registerTime)) || 0; }
    function keyOf(it) { return it && (it.id || it.account || it.accountId); }
    function isDel(it) { var k = keyOf(it); return k && delSet[k]; }
    function add(it) {
      if (!it || typeof it !== "object") return;
      if (isDel(it)) return;
      var k = keyOf(it);
      if (!k) { noKey.push(it); return; }
      if (!map[k]) map[k] = [it, ts(it)];
      else if (ts(it) > map[k][1]) map[k] = [it, ts(it)];
    }
    (Array.isArray(cloudArr) ? cloudArr : []).forEach(add);
    (Array.isArray(localArr) ? localArr : []).forEach(add);
    var out = [];
    Object.keys(map).forEach(function (k) { out.push(map[k][0]); });
    return out.concat(noKey);
  },
  get: function (binKey, cb) {
    var self = this;
    var local = this._getLocal(binKey);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.pull === "function") {
      var settled = false;
      var finish = function (cloudArr, ok) {
        if (settled) return; settled = true;
        if (ok && Array.isArray(cloudArr)) {
          var merged = self._mergeLists(local, cloudArr, binKey);
          self._setLocal(binKey, merged);
          cb(merged, true, cloudArr);
        } else {
          cb(local, false, local);
        }
      };
      adapter.pull(binKey, finish);
      setTimeout(function () { finish(local, false); }, 2500);
    } else {
      setTimeout(function () { cb(local, true, local); }, 0);
    }
  },
  put: function (binKey, data, cb) {
    this._setLocal(binKey, data);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.push === "function") {
      var settled = false;
      var finish = function (ok) { if (settled) return; settled = true; if (typeof cb === "function") cb(ok); };
      adapter.push(binKey, data, finish);
      setTimeout(function () { finish(false); }, 2500);
    } else {
      if (typeof cb === "function") setTimeout(function () { cb(true); }, 0);
    }
  },
  syncAll: function (cb) {
    var adapter = this._adapterNow();
    if (!adapter) { if (typeof cb === "function") cb(true); return; }
    var self = this, keys = ["accounts", "technicians", "notices", "audit_log"], pending = keys.length;
    function done() { pending--; if (pending <= 0 && typeof cb === "function") cb(true); }
    keys.forEach(function (k) {
      var snapshot = self._getLocal(k);
      self.get(k, function (mergedArr, ok, rawArr) {
        if (!ok) { done(); return; }
        if (!Array.isArray(rawArr)) rawArr = [];
        var merged = self._mergeLists(snapshot, rawArr, k);
        var same = JSON.stringify(merged) === JSON.stringify(rawArr);
        if (same) done();
        else self.put(k, merged, function () { done(); });
      });
    });
  },
  getCurrentUser: function () {
    try { var raw = localStorage.getItem("rose_current_user"); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  genId: function () {
    var ts = Date.now().toString(36);
    var r1 = Math.random().toString(36).slice(2);
    var r2 = "";
    try { r2 = crypto.getRandomValues(new Uint32Array(1))[0].toString(36); }
    catch (e) { r2 = Math.random().toString(36).slice(2); }
    return ts + r1 + r2;
  },
  _deletedKey: function (binKey) { return 'rose_deleted_' + binKey; },
  getDeleted: function (binKey) {
    try { return JSON.parse(localStorage.getItem(this._deletedKey(binKey)) || "[]"); } catch (e) { return []; }
  },
  markDeleted: function (binKey, id) {
    if (!id) return;
    var d = this.getDeleted(binKey);
    if (d.indexOf(id) < 0) d.push(id);
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  },
  unmarkDeleted: function (binKey, id) {
    var d = this.getDeleted(binKey).filter(function (x) { return x !== id; });
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  }
};

// 页面加载后如有适配器则静默同步；纯本地模式下直接 no-op（不联网、不弹窗）
setTimeout(function () { try { JB.syncAll(); } catch (e) {} }, 800);

// 全局错误捕获（保留，便于排查）
window.onerror = function (m, s, l, c) {
  try {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap;";
    d.textContent = "页面报错: " + m + " (" + l + ":" + c + ")";
    (document.body || document.documentElement).appendChild(d);
  } catch (e) {}
  return false;
};

/*
 * 可选多端同步：在引入本文件之后、页面逻辑之前设置 window.RoseSyncAdapter 即可，
 * 例如 local-api.js。本地永远优先，后端不可用也不影响本机数据。
 */
</script>





  <title>个人中心 - 百合上门</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #FFF5F7; color: #333; min-height: 100vh; padding-bottom: 40px; }
    .header { background: linear-gradient(135deg, #C2185B, #E91E63); color: #fff; padding: 16px; text-align: center; font-size: 18px; font-weight: bold; }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 13px; color: #666; margin-bottom: 6px; display: block; font-weight: 500; }
    .form-input, .form-textarea { width: 100%; padding: 11px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 15px; outline: none; font-family: inherit; box-sizing: border-box; }
    .form-input:focus, .form-textarea:focus { border-color: #C2185B; }
    .form-textarea { resize: vertical; min-height: 70px; }
    .btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #C2185B, #E91E63); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .status-tip { font-size: 14px; padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; line-height: 1.6; }
    .tip-wait { background: #FFF3E0; color: #E65100; border-left: 4px solid #FF9800; }
    .tip-ok { background: #E8F5E9; color: #2E7D32; border-left: 4px solid #2E7D32; }
    .tip-reject { background: #FFEBEE; color: #C62828; border-left: 4px solid #F44336; }
    .tip-new { background: #FFF8E1; color: #795548; border-left: 4px solid #795548; }
    .photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .photo-item { position: relative; width: 80px; height: 80px; border-radius: 10px; overflow: hidden; background: #f3e4e9; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; }
    .photo-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.6); color: #fff; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; line-height: 20px; text-align: center; cursor: pointer; }
    .photo-add { width: 80px; height: 80px; border: 1.5px dashed #C2185B; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #C2185B; cursor: pointer; }
    .empty { text-align: center; color: #bbb; padding: 40px 20px; }
    .empty a { color: #C2185B; }
    .logout-btn { color: #999; font-size: 13px; cursor: pointer; text-align: center; margin-top: 10px; }
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.8); color: #fff; padding: 12px 28px; border-radius: 10px; font-size: 14px; z-index: 99999; }
    .cloud-badge { position: fixed; top: 8px; right: 8px; background: #4CAF50; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 20px; z-index: 999; }
    .cloud-badge.offline { background: #999; }
  </style>

  <!-- PWA 配置 -->
  <link rel="manifest" href="manifest.json?v=20260817">
  <meta name="theme-color" content="#C2185B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%23C2185B' width='192' height='192' rx='24'/%3E%3Ctext x='96' y='120' font-size='80' text-anchor='middle'%3E🌹%3C/text%3E%3C/svg%3E">
<script>
window.imgErr = function(img) {
  try {
    img.onerror = null;
    img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 280 220'><rect width='280' height='220' fill='%23fce4ec'/><text x='140' y='125' font-size='40' text-anchor='middle' fill='%23C2185B'>暂无图片</text></svg>";
  } catch (e) {}
};
</script>
</head>
<body>
  <div id="cloudBadge" class="cloud-badge" style="display:none;"></div>
  <div class="header">个人中心</div>
  <div class="container">
    <div id="loggedOut" class="empty">请先 <a href="login.html?v=20260817">登录</a> 或 <a href="register_v2.html?v=20260824">注册</a> 后填写技师资料</div>
    <div id="loggedIn" style="display:none;">
      <div id="statusTip" style="display:none;"></div>
      <div class="card">
        <div class="form-group">
          <label class="form-label">技师姓名 *</label>
          <input class="form-input" id="name" placeholder="例如：小芳">
        </div>
        <div class="form-group">
          <label class="form-label">联系电话 *</label>
          <input class="form-input" id="phone" placeholder="例如：13800138000">
        </div>
        <div class="form-group">
          <label class="form-label">服务地址 *</label>
          <input class="form-input" id="address" placeholder="例如：南京市XX路XX号">
        </div>
        <div class="form-group">
          <label class="form-label">价格（元/次）*</label>
          <input class="form-input" id="price" placeholder="例如：198" type="number">
        </div>
        <div class="form-group">
          <label class="form-label">服务项目（最多3项）</label>
          <div id="servicesInputs">
            <input type="text" class="form-input" id="s1" placeholder="第1项，如：全身推拿">
            <input type="text" class="form-input" id="s2" placeholder="第2项，如：肩颈按摩">
            <input type="text" class="form-input" id="s3" placeholder="第3项，如：精油SPA">
          </div>
        </div>
      </div>
      <div class="card">
        <div class="form-group">
          <label class="form-label">形象照片（最多9张）</label>
          <div class="photos" id="photoBox"></div>
          <input type="file" id="photoFile" accept="image/*" multiple style="display:none;" onchange="onPhotos(this)">
        </div>
      </div>
      <button class="btn" id="submitBtn" onclick="submitOrUpdate()">提交审核</button>
      <div class="logout-btn" onclick="logout()">退出登录</div>
      
      
    </div>
  </div>

<script>
var photos = [];
var myTech = null;
var user = null;

function toast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2200);
}

function asArr(v) {
  if (Array.isArray(v)) return v;
  if (v && typeof v === 'object' && Array.isArray(v.record)) return v.record;
  return [];
}


function logout() {
  if (confirm('确定退出？')) {
    localStorage.removeItem('rose_current_user');
    location.href='index.html?v=20260817';
  }
}

var MAX_PHOTOS = 9;
function compressImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var max = 1000, w = img.width, h = img.height;
      if (w > h && w > max) { h = h * max / w; w = max; }
      else if (h > max) { w = w * max / h; h = max; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      try { cb(canvas.toDataURL('image/jpeg', 0.7)); } catch (err) { cb(null); }
    };
    img.onerror = function() { cb(null); };
    img.src = e.target.result;
  };
  reader.onerror = function() { cb(null); };
  reader.readAsDataURL(file);
}

function renderPhotos() {
  var box = document.getElementById('photoBox');
  if (!box) return;
  box.innerHTML = '';
  photos.forEach(function(p, i) {
    var div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = '<img src="' + (p || '') + '" onerror="imgErr(this)"><div class="photo-del" onclick="delPhoto(' + i + ')">×</div>';
    box.appendChild(div);
  });
  if (photos.length < MAX_PHOTOS) {
    var add = document.createElement('div');
    add.className = 'photo-add';
    add.textContent = '+';
    add.onclick = function() { var f = document.getElementById('photoFile'); if (f) f.click(); };
    box.appendChild(add);
  }
}

function delPhoto(i) {
  if (i < 0 || i >= photos.length) return;
  photos.splice(i, 1);
  renderPhotos();
}

function onPhotos(input) {
  if (!input || !input.files || !input.files.length) return;
  var remaining = MAX_PHOTOS - photos.length;
  if (remaining <= 0) { toast('最多上传 ' + MAX_PHOTOS + ' 张'); return; }
  var files = Array.prototype.slice.call(input.files);
  var toProcess = Math.min(files.length, remaining);
  var done = 0;
  for (var k = 0; k < toProcess; k++) {
    (function(file) {
      compressImage(file, function(b64) {
        if (b64) photos.push(b64);
        done++;
        if (done >= toProcess) renderPhotos();
      });
    })(files[k]);
  }
  input.value = '';
}





function renderStatus() {
  var tip = document.getElementById('statusTip');
  var btn = document.getElementById('submitBtn');
  tip.style.display = 'block';
  if (myTech) {
    document.getElementById('name').value = myTech.name || '';
    document.getElementById('phone').value = myTech.phone || '';
    document.getElementById('address').value = myTech.address || '';
    document.getElementById('price').value = myTech.price || '';
    // 兼容：services 可能是数组（新）或字符串（旧）
    var svcs = myTech.services;
    if (typeof svcs === 'string') svcs = svcs ? svcs.split(/[,，、]/).filter(Boolean) : [];
    document.getElementById('s1').value = svcs[0] || '';
    document.getElementById('s2').value = svcs[1] || '';
    document.getElementById('s3').value = svcs[2] || '';
    photos = (myTech.photos && myTech.photos.length) ? myTech.photos.slice() : [];
    renderPhotos();
    if (myTech.status === '待审核') {
      tip.className = 'status-tip tip-wait';
      tip.innerHTML = '⏳ <b>审核中</b><br>您的资料已提交，请耐心等待管理员审核...';
      btn.textContent = '修改资料并重新提交';
    } else if (myTech.status === '被拒绝') {
      tip.className = 'status-tip tip-reject';
      tip.innerHTML = '❌ <b>审核未通过</b><br>请修改下方资料后重新提交';
      btn.textContent = '修改后重新提交';
    } else if (myTech.status === '已通过') {
      tip.className = 'status-tip tip-ok';
      tip.innerHTML = '✅ <b>已通过审核</b><br>您的资料已展示在首页！';
      btn.textContent = '修改资料';
    }
  } else {
    tip.className = 'status-tip tip-new';
    tip.innerHTML = '📋 请填写下方资料并提交审核（带 * 为必填）';
    btn.textContent = '提交审核';
    photos = [];
    renderPhotos();
  }
}

function submitOrUpdate() {
  if (!user) { location.href='login.html?v=20260817'; return; }
  var name = document.getElementById('name').value.trim();
  var phone = document.getElementById('phone').value.trim();
  var address = document.getElementById('address').value.trim();
  var price = document.getElementById('price').value.trim();
  // 收集3个服务项目，合并为数组
  var s1 = document.getElementById('s1').value.trim();
  var s2 = document.getElementById('s2').value.trim();
  var s3 = document.getElementById('s3').value.trim();
  var svcs = [s1, s2, s3].filter(function(v){ return v; });
  if (svcs.length === 0) { toast('请填写至少1项服务项目'); return; }

  if (!name) { toast('请填写姓名'); return; }
  if (!phone) { toast('请填写电话'); return; }
  if (!address) { toast('请填写地址'); return; }
  if (!price) { toast('请填写价格'); return; }
  if (svcs.length === 0) { toast('请填写服务项目'); return; }
  
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 提交中...';

  var entry = {
    id: myTech ? myTech.id : 't_' + JB.genId(),
    accountId: user.id,
    account: user.account,
    name: name,
    phone: phone,
    address: address,
    price: price,
    services: svcs,
    photos: photos,
    status: '待审核',
    submitTime: myTech ? myTech.submitTime : Date.now(),
    updateTime: Date.now()
  };

  // 从云端读取最新列表，再更新
  JB.get('technicians', function(list) {
    if (!Array.isArray(list)) list = [];
    var found = false;
    for (var i = 0; i < list.length; i++) {
      if (list[i].accountId === user.id) { list[i] = entry; found = true; break; }
    }
    if (!found) list.unshift(entry);
    // 【修复】防覆盖：如果该账号已有已通过记录，不再用待审核覆盖管理员审核结果
    var _ex = list.find(function(t){ return t.accountId === user.id && t.id !== entry.id && t.status === '已通过'; });
    if (_ex) { btn.disabled = false; btn.textContent = '资料已审核通过，无需重复提交'; toast('当前资料已审核通过 √'); return; }
        JB.put('technicians', list, function(ok) {
      btn.disabled = false;
      if (ok) {
        myTech = entry;
        toast('已提交，等待审核 ✓');
        btn.textContent = '修改资料并重新提交';
        renderStatus();
      } else {
        // 【修复P1-5】失败时给出明确提示，避免用户以为成功了
        toast('网络异常，数据已暂存本地，网络恢复后将自动同步');
        btn.textContent = '提交失败，点此重试';
        myTech = entry;
      }
    });
  });
}

function initPage() {
  user = JB.getCurrentUser();
  if (!user) {
    document.getElementById('loggedOut').style.display = 'block';
    document.getElementById('loggedIn').style.display = 'none';
    return;
  }
  document.getElementById('loggedOut').style.display = 'none';
  document.getElementById('loggedIn').style.display = 'block';

  JB.get('technicians', function(list) {
    if (!Array.isArray(list)) list = [];
    myTech = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].accountId === user.id) { myTech = list[i]; break; }
    }
    renderStatus();
  });
}

initPage();
</script>

<script>
// 注册 Service Worker (PWA)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=20260824')
    .then(function(reg) { console.log('[PWA] SW 注册成功:', reg.scope); })
    .catch(function(err) { console.log('[PWA] SW 注册失败:', err); });
}
</script>
