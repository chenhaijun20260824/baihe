<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
/*
 * rose-sync.js — 本地优先同步核心库
 */
var JB = {
  BINS: {
    accounts: 'accounts',
    technicians: 'technicians',
    notices: 'notices',
    audit_log: 'audit_log',
    village_heads: 'village_heads',
    villagers: 'villagers',
    supermarkets: 'supermarkets',
    markets: 'markets',
    factories: 'factories',
    customer_service: 'customer_service',
    sales_managers: 'sales_managers',
    village_agents: 'village_agents',
    town_agents: 'town_agents',
    county_agents: 'county_agents'
  },
  _adapterNow: function () {
    try { return (typeof window !== 'undefined' && window.RoseSyncAdapter) ? window.RoseSyncAdapter : null; }
    catch (e) { return null; }
  },
  _storageKey: function (binKey) { return 'rose_' + binKey; },
  _unwrap: function (v) {
    var depth = 0;
    while (depth < 5 && v && typeof v === 'object' && 'record' in v && Object.keys(v).length <= 2) { v = v.record; depth++; }
    return v;
  },
  _getLocal: function (binKey) {
    try {
      var v = localStorage.getItem(this._storageKey(binKey));
      if (!v) return [];
      return this._unwrap(JSON.parse(v));
    } catch (e) { return []; }
  },
  _setLocal: function (binKey, data) {
    try {
      localStorage.setItem(this._storageKey(binKey), JSON.stringify(data));
      return true;
    } catch (e) {
      if (typeof toast === 'function') toast('本地存储已满，请清理浏览器缓存');
      return false;
    }
  },
  _mergeLists: function (localArr, cloudArr, binKey) {
    var self = this;
    var delSet = {};
    if (binKey) self.getDeleted(binKey).forEach(function (id) { delSet[id] = true; });
    var map = {}, noKey = [];
    function ts(it) { return (it && (it.updateTime || it.time || it.registerTime)) || 0; }
    function keyOf(it) { return it && (it.id || it.account || it.accountId); }
    function isDel(it) { var k = keyOf(it); return k && delSet[k]; }
    function add(it) {
      if (!it || typeof it !== "object") return;
      if (isDel(it)) return;
      var k = keyOf(it);
      if (!k) { noKey.push(it); return; }
      if (!map[k]) map[k] = [it, ts(it)];
      else if (ts(it) > map[k][1]) map[k] = [it, ts(it)];
    }
    (Array.isArray(cloudArr) ? cloudArr : []).forEach(add);
    (Array.isArray(localArr) ? localArr : []).forEach(add);
    var out = [];
    Object.keys(map).forEach(function (k) { out.push(map[k][0]); });
    return out.concat(noKey);
  },
  get: function (binKey, cb) {
    var self = this;
    var local = this._getLocal(binKey);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.pull === "function") {
      var settled = false;
      var finish = function (cloudArr, ok) {
        if (settled) return; settled = true;
        if (ok && Array.isArray(cloudArr)) {
          var merged = self._mergeLists(local, cloudArr, binKey);
          self._setLocal(binKey, merged);
          cb(merged, true, cloudArr);
        } else {
          cb(local, false, local);
        }
      };
      adapter.pull(binKey, finish);
      setTimeout(function () { finish(local, false); }, 2500);
    } else {
      setTimeout(function () { cb(local, true, local); }, 0);
    }
  },
  put: function (binKey, data, cb) {
    this._setLocal(binKey, data);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.push === "function") {
      var settled = false;
      var finish = function (ok) { if (settled) return; settled = true; if (typeof cb === "function") cb(ok); };
      adapter.push(binKey, data, finish);
      setTimeout(function () { finish(false); }, 2500);
    } else {
      if (typeof cb === "function") setTimeout(function () { cb(true); }, 0);
    }
  },
  syncAll: function (cb) {
    var adapter = this._adapterNow();
    if (!adapter) { if (typeof cb === "function") cb(true); return; }
    var self = this, keys = ["accounts", "technicians", "notices", "audit_log"], pending = keys.length;
    function done() { pending--; if (pending <= 0 && typeof cb === "function") cb(true); }
    keys.forEach(function (k) {
      var snapshot = self._getLocal(k);
      self.get(k, function (mergedArr, ok, rawArr) {
        if (!ok) { done(); return; }
        if (!Array.isArray(rawArr)) rawArr = [];
        var merged = self._mergeLists(snapshot, rawArr, k);
        var same = JSON.stringify(merged) === JSON.stringify(rawArr);
        if (same) done();
        else self.put(k, merged, function () { done(); });
      });
    });
  },
  getCurrentUser: function () {
    try { var raw = localStorage.getItem("rose_current_user"); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  genId: function () {
    var ts = Date.now().toString(36);
    var r1 = Math.random().toString(36).slice(2);
    var r2 = "";
    try { r2 = crypto.getRandomValues(new Uint32Array(1))[0].toString(36); }
    catch (e) { r2 = Math.random().toString(36).slice(2); }
    return ts + r1 + r2;
  },
  _deletedKey: function (binKey) { return 'rose_deleted_' + binKey; },
  getDeleted: function (binKey) {
    try { return JSON.parse(localStorage.getItem(this._deletedKey(binKey)) || "[]"); } catch (e) { return []; }
  },
  markDeleted: function (binKey, id) {
    if (!id) return;
    var d = this.getDeleted(binKey);
    if (d.indexOf(id) < 0) d.push(id);
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  },
  unmarkDeleted: function (binKey, id) {
    var d = this.getDeleted(binKey).filter(function (x) { return x !== id; });
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  }
};
setTimeout(function () { try { JB.syncAll(); } catch (e) {} }, 800);
window.onerror = function (m, s, l, c) {
  try {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap;";
    d.textContent = "页面报错: " + m + " (" + l + ":" + c + ")";
    (document.body || document.documentElement).appendChild(d);
  } catch (e) {}
  return false;
};
  </script>

<script>
// ==================== 角色配置 ====================
var ROLE_CONFIG = {
  technician: { name: '技师', icon: '💆', bin: 'technicians', prefix: 'tech_' },
  village_head: { name: '村长', icon: '🏘️', bin: 'village_heads', prefix: 'vh_' },
  villager: { name: '村民', icon: '🧑‍🌾', bin: 'villagers', prefix: 'vil_' },
  supermarket: { name: '超市', icon: '🏪', bin: 'supermarkets', prefix: 'sup_' },
  market: { name: '农贸市场', icon: '🥬', bin: 'markets', prefix: 'mkt_' },
  factory: { name: '企业工厂', icon: '🏭', bin: 'factories', prefix: 'fac_' },
  customer_service: { name: '客服', icon: '🎧', bin: 'customer_service', prefix: 'cs_' },
  sales_manager: { name: '销售经理', icon: '📊', bin: 'sales_managers', prefix: 'sm_' },
  village_agent: { name: '村级代理', icon: '📍', bin: 'village_agents', prefix: 'va_' },
  town_agent: { name: '镇级代理', icon: '📌', bin: 'town_agents', prefix: 'ta_' },
  county_agent: { name: '县级代理', icon: '🗺️', bin: 'county_agents', prefix: 'ca_' }
};

var ALL_ROLES = Object.keys(ROLE_CONFIG);
var photos = [];
var pendingUploads = 0;
var currentRole = null;
var myRecord = null;
var user = null;
var _allRoleData = {};

function toast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2200);
}

function logout() {
  if (confirm('确定退出？')) {
    localStorage.removeItem('rose_current_user');
    location.href = 'index.html?v=20260916';
  }
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// ==================== 图片上传 ====================
var MAX_PHOTOS = 9;

function compressImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var max = 1000, w = img.width, h = img.height;
      if (w > h && w > max) { h = h * max / w; w = max; }
      else if (h > max) { w = w * max / h; h = max; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      try { cb(canvas.toDataURL('image/jpeg', 0.7)); } catch (err) { cb(null); }
    };
    img.onerror = function() { cb(null); };
    img.src = e.target.result;
  };
  reader.onerror = function() { cb(null); };
  reader.readAsDataURL(file);
}

function renderPhotos() {
  var box = document.getElementById('photoBox');
  if (!box) return;
  box.innerHTML = '';
  photos.forEach(function(p, i) {
    var div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = '<img src="' + (p || '') + '" onerror="imgErr(this)"><div class="photo-del" onclick="delPhoto(' + i + ')">×</div>';
    box.appendChild(div);
  });
  if (photos.length < MAX_PHOTOS) {
    var add = document.createElement('div');
    add.className = 'photo-add';
    add.textContent = '+';
    add.onclick = function() { var f = document.getElementById('photoFile'); if (f) f.click(); };
    box.appendChild(add);
  }
}

function delPhoto(i) {
  if (i < 0 || i >= photos.length) return;
  photos.splice(i, 1);
  renderPhotos();
}

function dataURLtoBlob(dataUrl) {
  try {
    var parts = dataUrl.split(',');
    var mime = (parts[0].match(/:(.*?);/) || [,'image/jpeg'])[1];
    var bstr = atob(parts[1]);
    var n = bstr.length;
    var u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    return new Blob([u8], { type: mime });
  } catch (e) { return null; }
}

function storePhoto(file, cb) {
  compressImage(file, function(b64) {
    if (!b64) { cb(null); return; }
    var adapter = (typeof window !== 'undefined' && window.RoseSyncAdapter);
    if (adapter && typeof adapter.uploadImage === 'function') {
      var blob = dataURLtoBlob(b64);
      if (!blob) { cb(b64); return; }
      var fname = 'img_' + Date.now() + '_' + Math.floor(Math.random() * 1e9) + '.jpg';
      adapter.uploadImage(fname, blob, function(url) { cb(url || b64); });
    } else {
      cb(b64);
    }
  });
}

function onPhotos(input) {
  if (!input || !input.files || !input.files.length) return;
  var remaining = MAX_PHOTOS - photos.length;
  if (remaining <= 0) { toast('最多上传 ' + MAX_PHOTOS + ' 张'); return; }
  var files = Array.prototype.slice.call(input.files);
  var toProcess = Math.min(files.length, remaining);
  var uploading = (typeof window !== 'undefined' && window.RoseSyncAdapter && typeof window.RoseSyncAdapter.uploadImage === 'function');
  if (uploading) toast('正在上传图片到云端…');
  for (var k = 0; k < toProcess; k++) {
    pendingUploads++;
    (function(file) {
      storePhoto(file, function(photoVal) {
        pendingUploads--;
        if (photoVal) photos.push(photoVal);
        renderPhotos();
      });
    })(files[k]);
  }
  input.value = '';
}

// ==================== 角色弹窗 ====================
function openRoleModal() {
  var grid = document.getElementById('roleGrid');
  grid.innerHTML = '';
  ALL_ROLES.forEach(function(key) {
    var cfg = ROLE_CONFIG[key];
    var item = document.createElement('div');
    item.className = 'role-item' + (key === currentRole ? ' active' : '');
    item.innerHTML = '<div class="role-icon">' + cfg.icon + '</div><div class="role-name">' + cfg.name + '</div>';
    item.onclick = function() {
      if (key === currentRole) { closeRoleModal(); return; }
      if (confirm('切换角色将把当前角色的资料标记为"已撤销"，确定切换到"' + cfg.name + '"吗？')) {
        closeRoleModal();
        changeRole(key);
      }
    };
    grid.appendChild(item);
  });
  document.getElementById('roleModal').style.display = 'flex';
}

function closeRoleModal() {
  document.getElementById('roleModal').style.display = 'none';
}

function changeRole(newRole) {
  var cfg = ROLE_CONFIG[newRole];
  if (!cfg) return;
  // 1. 如果有旧角色资料，标记为已撤销
  if (currentRole && myRecord) {
    var oldBin = ROLE_CONFIG[currentRole].bin;
    (function(oldBinKey, oldRec) {
      JB.get(oldBinKey, function(list) {
        if (!Array.isArray(list)) list = [];
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === oldRec.id) {
            list[i].status = '已撤销';
            list[i].updateTime = Date.now();
            JB.put(oldBinKey, list, function() {});
            break;
          }
        }
      });
    })(oldBin, myRecord);
  }
  // 2. 更新当前用户角色
  user.role = newRole;
  localStorage.setItem('rose_current_user', JSON.stringify(user));
  // 3. 同步更新 accounts 中的 role
  JB.get('accounts', function(list) {
    if (!Array.isArray(list)) list = [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === user.id) {
        list[i].role = newRole;
        JB.put('accounts', list, function() {});
        break;
      }
    }
  });
  currentRole = newRole;
  myRecord = null;
  photos = [];
  // 4. 重新渲染表单
  renderProfilePage();
  toast('已切换为 ' + cfg.name + '，请填写新资料');
}

function renderProfilePage() {
  // 渲染角色选择条
  var bar = document.getElementById('currentRoleBar');
  if (currentRole) {
    bar.style.display = 'flex';
    var cfg = ROLE_CONFIG[currentRole];
    document.getElementById('currentRoleEmoji').textContent = cfg.icon;
    document.getElementById('currentRoleName').textContent = cfg.name;
  } else {
    bar.style.display = 'none';
  }
  // 渲染状态提示
  renderStatus();
  // 渲染对应角色表单
  renderRoleForm(currentRole);
}

function renderStatus() {
  var tip = document.getElementById('statusTip');
  var btn = document.getElementById('submitBtn');
  if (!tip || !btn) return;
  tip.style.display = 'block';
  if (myRecord) {
    if (myRecord.status === '待审核') {
      tip.className = 'status-tip tip-wait';
      tip.innerHTML = '⏳ <b>审核中</b><br>您的资料已提交，请耐心等待管理员审核...';
      btn.textContent = '修改资料并重新提交';
    } else if (myRecord.status === '已拒绝' || myRecord.status === '已拒绝') {
      tip.className = 'status-tip tip-reject';
      tip.innerHTML = '❌ <b>审核未通过</b><br>请修改下方资料后重新提交';
      btn.textContent = '修改后重新提交';
    } else if (myRecord.status === '已通过') {
      tip.className = 'status-tip tip-ok';
      tip.innerHTML = '✅ <b>已通过审核</b><br>您的资料已展示在首页！';
      btn.textContent = '修改资料';
    } else if (myRecord.status === '已撤销') {
      tip.className = 'status-tip tip-new';
      tip.innerHTML = '📋 角色已切换，请填写新资料';
      btn.textContent = '提交审核';
    } else {
      tip.className = 'status-tip tip-new';
      tip.innerHTML = '📋 请填写下方资料并提交审核';
      btn.textContent = '提交审核';
    }
  } else {
    tip.className = 'status-tip tip-new';
    tip.innerHTML = '📋 请填写下方资料并提交审核（带 * 为必填）';
    btn.textContent = '提交审核';
  }
}

function renderRoleForm(role) {
  var container = document.getElementById('roleFormContainer');
  if (!role) {
    container.innerHTML = '<div class="card"><p style="text-align:center;color:#bbb;padding:20px;">请先选择角色</p><button class="btn btn-outline" onclick="openRoleModal()" style="margin-top:12px;">🔄 选择角色</button></div>';
    return;
  }
  var cfg = ROLE_CONFIG[role];
  var html = '';
  html += '<div class="card" id="formCard">';
  html += '<div class="section-title">' + cfg.icon + ' ' + cfg.name + ' 资料</div>';

  switch (role) {
    case 'technician':
      html += formTechnician();
      break;
    case 'village_head':
      html += formVillageHead();
      break;
    case 'villager':
      html += formVillager();
      break;
    case 'supermarket':
      html += formSupermarket();
      break;
    case 'market':
      html += formMarket();
      break;
    case 'factory':
      html += formFactory();
      break;
    case 'customer_service':
      html += formCustomerService();
      break;
    case 'sales_manager':
      html += formSalesManager();
      break;
    case 'village_agent':
      html += formVillageAgent();
      break;
    case 'town_agent':
      html += formTownAgent();
      break;
    case 'county_agent':
      html += formCountyAgent();
      break;
  }

  // 照片上传（所有角色通用）
  html += '<div class="form-section">';
  html += '<div class="section-header">📷 形象照片（最多9张）</div>';
  html += '<div class="photos" id="photoBox"></div>';
  html += '<input type="file" id="photoFile" accept="image/*" multiple style="display:none;" onchange="onPhotos(this)">';
  html += '</div>';

  html += '<button class="btn" id="submitBtn" onclick="submitOrUpdate()">提交审核</button>';
  html += '<div class="logout-btn" onclick="logout()">退出登录</div>';
  html += '</div>';

  container.innerHTML = html;
  renderPhotos();

  // 填充已有数据
  if (myRecord) {
    fillFormData(role, myRecord);
  }

  // 初始化动态行（农产品、手工等）
  initDynamicRows();
  initCheckboxRows();
}

function fillFormData(role, data) {
  if (!data) return;
  photos = (data.photos && data.photos.length) ? data.photos.slice() : [];
  renderPhotos();
  // 填充通用字段
  var fields = ['name', 'phone', 'province', 'city', 'county', 'village', 'town', 'address', 'description', 'age', 'gender'];
  fields.forEach(function(f) {
    var el = document.getElementById('f_' + f);
    if (el && data[f]) el.value = data[f];
  });
  // 角色特定字段
  switch (role) {
    case 'technician':
      var svcs = data.services;
      if (typeof svcs === 'string') svcs = svcs ? svcs.split(/[,，、]/).filter(Boolean) : [];
      ['s1','s2','s3'].forEach(function(id, i) {
        var el = document.getElementById(id);
        if (el && svcs && svcs[i]) el.value = svcs[i];
      });
      var priceEl = document.getElementById('price');
      if (priceEl && data.price) priceEl.value = data.price;
      break;
    case 'villager':
      // 农产品
      if (data.products && data.products.length) {
        data.products.forEach(function(p, i) {
          var nameEl = document.getElementById('prod_name_' + i);
          var priceEl = document.getElementById('prod_price_' + i);
          if (nameEl) nameEl.value = p.name || '';
          if (priceEl) priceEl.value = p.price || '';
        });
      }
      // 手工
      if (data.crafts && data.crafts.length) {
        data.crafts.forEach(function(c, i) {
          var nameEl = document.getElementById('craft_name_' + i);
          var priceEl = document.getElementById('craft_price_' + i);
          if (nameEl) nameEl.value = c.name || '';
          if (priceEl) priceEl.value = c.price || '';
        });
      }
      // 技能
      if (data.skills && Array.isArray(data.skills)) {
        data.skills.forEach(function(s) {
          var el = document.getElementById('skill_' + s);
          if (el) { el.checked = true; el.closest('.checkbox-item').classList.add('checked'); }
        });
      }
      // 求职状态
      if (data.jobStatus) {
        var radios = document.getElementsByName('jobStatus');
        for (var i = 0; i < radios.length; i++) {
          if (radios[i].value === data.jobStatus) { radios[i].checked = true; break; }
        }
      }
      // 代理选择
      ['villageAgent','townAgent','countyAgent'].forEach(function(f) {
        var el = document.getElementById('f_' + f);
        if (el && data[f]) el.value = data[f];
      });
      break;
    case 'supermarket':
      if (data.demands && data.demands.length) {
        data.demands.forEach(function(d, i) {
          var el = document.getElementById('demand_' + i);
          if (el) el.value = d;
        });
      }
      if (data.marketName) {
        var mn = document.getElementById('f_marketName');
        if (mn) mn.value = data.marketName;
      }
      break;
    case 'market':
      if (data.marketName) {
        var mn2 = document.getElementById('f_marketName');
        if (mn2) mn2.value = data.marketName;
      }
      if (data.houseNumber) {
        var hn = document.getElementById('f_houseNumber');
        if (hn) hn.value = data.houseNumber;
      }
      if (data.demands && data.demands.length) {
        data.demands.forEach(function(d, i) {
          var el = document.getElementById('demand_' + i);
          if (el) el.value = d;
        });
      }
      break;
    case 'factory':
      if (data.factoryName) {
        var fn = document.getElementById('f_factoryName');
        if (fn) fn.value = data.factoryName;
      }
      if (data.product) {
        var p2 = document.getElementById('f_product');
        if (p2) p2.value = data.product;
      }
      if (data.jobs && data.jobs.length) {
        data.jobs.forEach(function(j, i) {
          var jobEl = document.getElementById('job_title_' + i);
          var salEl = document.getElementById('job_salary_' + i);
          if (jobEl) jobEl.value = j.title || '';
          if (salEl) salEl.value = j.salary || '';
        });
      }
      if (data.farmDemand) {
        var fd = document.getElementById('f_farmDemand');
        if (fd) fd.value = data.farmDemand;
      }
      break;
    case 'customer_service':
    case 'sales_manager':
      if (data.serviceArea) {
        var sa = document.getElementById('f_serviceArea');
        if (sa) sa.value = data.serviceArea;
      }
      if (data.linkedAgents) {
        var la = document.getElementById('f_linkedAgents');
        if (la) la.value = data.linkedAgents;
      }
      break;
    case 'village_agent':
    case 'town_agent':
    case 'county_agent':
      if (data.agentName) {
        var an = document.getElementById('f_agentName');
        if (an) an.value = data.agentName;
      }
      if (data.developedCount !== undefined) {
        var dc = document.getElementById('f_developedCount');
        if (dc) dc.value = data.developedCount;
      }
      if (data.factories && data.factories.length) {
        data.factories.forEach(function(fi, i) {
          var fnEl = document.getElementById('factory_name_' + i);
          if (fnEl) fnEl.value = fi.name || '';
        });
      }
      if (data.developedFactoriesCount !== undefined) {
        var dfc = document.getElementById('f_developedFactoriesCount');
        if (dfc) dfc.value = data.developedFactoriesCount;
      }
      break;
  }
}

function toggleCheck(item, group, val) {
  var cb = item.querySelector('input');
  if (!cb) return;
  cb.checked = !cb.checked;
  if (cb.checked) {
    item.classList.add('checked');
  } else {
    item.classList.remove('checked');
  }
}

function getCheckedSkills() {
  var skills = [];
  var cbs = document.querySelectorAll('#skillsGroup input[type="checkbox"]');
  for (var i = 0; i < cbs.length; i++) {
    if (cbs[i].checked) skills.push(cbs[i].value);
  }
  return skills;
}

// ==================== 提交 ====================
function submitOrUpdate() {
  if (!user) { location.href = 'login.html?v=20260916'; return; }
  if (pendingUploads > 0) { toast('图片还在上传中，请稍候…'); return; }
  var cfg = ROLE_CONFIG[currentRole];
  if (!cfg) return;

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 提交中...';

  // 收集数据
  var entry = collectFormData(currentRole);
  entry.id = myRecord ? myRecord.id : (cfg.prefix || 'r_') + JB.genId();
  entry.accountId = user.id;
  entry.account = user.account;
  entry.role = currentRole;
  entry.photos = photos.slice();
  entry.status = '待审核';
  entry.submitTime = myRecord ? myRecord.submitTime : Date.now();
  entry.updateTime = Date.now();

  var binKey = cfg.bin;

  // 检查是否已有已通过记录（不能重复提交覆盖审核结果）
  JB.get(binKey, function(list) {
    if (!Array.isArray(list)) list = [];
    var found = false;
    for (var i = 0; i < list.length; i++) {
      if (list[i].accountId === user.id) {
        // 如果已有一条且已通过，不允许用待审核覆盖
        if (list[i].status === '已通过' && list[i].id !== entry.id) {
          btn.disabled = false;
          btn.textContent = '该角色已有审核通过记录';
          toast('该角色资料已审核通过，无需重复提交 ✓');
          return;
        }
        list[i] = entry;
        found = true;
        break;
      }
    }
    if (!found) list.unshift(entry);

    JB.put(binKey, list, function(ok) {
      btn.disabled = false;
      if (ok) {
        myRecord = entry;
        toast('已提交，等待审核 ✓');
        btn.textContent = '修改资料并重新提交';
        renderStatus();
      } else {
        toast('网络异常，数据已暂存本地');
        btn.textContent = '提交失败，点此重试';
        myRecord = entry;
      }
    });
  });
}

function collectFormData(role) {
  var d = {};
  // 通用字段
  ['province', 'city', 'county', 'village', 'town', 'address', 'description', 'age', 'gender'].forEach(function(f) {
    var el = document.getElementById('f_' + f);
    if (el) d[f] = el.value.trim();
  });
  var nameEl = document.getElementById('f_name');
  if (nameEl) d.name = nameEl.value.trim();
  var phoneEl = document.getElementById('f_phone');
  if (phoneEl) d.phone = phoneEl.value.trim();

  switch (role) {
    case 'technician':
      d.price = getVal('price');
      var s1 = getVal('s1'), s2 = getVal('s2'), s3 = getVal('s3');
      d.services = [s1, s2, s3].filter(function(v) { return v; });
      break;
    case 'villager':
      d.products = collectDynamicRows('productsRows', 'prod_name_', 'prod_price_');
      d.crafts = collectDynamicRows('craftsRows', 'craft_name_', 'craft_price_');
      d.skills = getCheckedSkills();
      var radios = document.getElementsByName('jobStatus');
      for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) { d.jobStatus = radios[i].value; break; }
      }
      d.villageAgent = getVal('f_villageAgent');
      d.townAgent = getVal('f_townAgent');
      d.countyAgent = getVal('f_countyAgent');
      break;
    case 'supermarket':
      d.marketName = getVal('f_marketName');
      d.demands = collectDemandRows();
      break;
    case 'market':
      d.marketName = getVal('f_marketName');
      d.houseNumber = getVal('f_houseNumber');
      d.demands = [getVal('f_description')];
      break;
    case 'factory':
      d.factoryName = getVal('f_factoryName');
      d.product = getVal('f_product');
      d.farmDemand = getVal('f_farmDemand');
      d.jobs = collectDynamicRows2('jobsRows', 'job_title_', 'job_salary_');
      break;
    case 'customer_service':
      d.serviceArea = getVal('f_serviceArea');
      break;
    case 'sales_manager':
      d.serviceArea = getVal('f_serviceArea');
      d.linkedAgents = getVal('f_linkedAgents');
      break;
    case 'village_agent':
      d.agentName = getVal('f_agentName');
      d.developedCount = parseInt(getVal('f_developedCount')) || 0;
      break;
    case 'town_agent':
      d.agentName = getVal('f_agentName');
      d.developedCount = parseInt(getVal('f_developedCount')) || 0;
      d.developedFactoriesCount = parseInt(getVal('f_developedFactoriesCount')) || 0;
      d.factories = collectFactoryRows();
      break;
    case 'county_agent':
      d.agentName = getVal('f_agentName');
      d.developedCount = parseInt(getVal('f_developedCount')) || 0;
      d.developedFactoriesCount = parseInt(getVal('f_developedFactoriesCount')) || 0;
      d.factories = collectFactoryRows();
      break;
  }
  return d;
}

function collectDynamicRows(boxId, namePrefix, pricePrefix) {
  var box = document.getElementById(boxId);
  if (!box) return [];
  var result = [];
  var rows = box.children;
  for (var i = 0; i < rows.length; i++) {
    var nameEl = document.getElementById(namePrefix + i);
    var priceEl = document.getElementById(pricePrefix + i);
    if (nameEl && nameEl.value.trim()) {
      result.push({ name: nameEl.value.trim(), price: priceEl ? priceEl.value.trim() : '' });
    }
  }
  return result;
}

function collectDynamicRows2(boxId, titlePrefix, salaryPrefix) {
  var box = document.getElementById(boxId);
  if (!box) return [];
  var result = [];
  var rows = box.children;
  for (var i = 0; i < rows.length; i++) {
    var titleEl = document.getElementById(titlePrefix + i);
    var salEl = document.getElementById(salaryPrefix + i);
    if (titleEl && titleEl.value.trim()) {
      result.push({ title: titleEl.value.trim(), salary: salEl ? salEl.value.trim() : '' });
    }
  }
  return result;
}

function collectDemandRows() {
  var box = document.getElementById('demandsRows');
  if (!box) return [];
  var result = [];
  var rows = box.children;
  for (var i = 0; i < rows.length; i++) {
    var el = document.getElementById('demand_' + i);
    if (el && el.value.trim()) result.push(el.value.trim());
  }
  return result;
}

function collectFactoryRows() {
  var box = document.getElementById('factoriesRows');
  if (!box) return [];
  var result = [];
  var rows = box.children;
  for (var i = 0; i < rows.length; i++) {
    var el = document.getElementById('factory_name_' + i);
    if (el && el.value.trim()) result.push({ name: el.value.trim() });
  }
  return result;
}

// ==================== 初始化 ====================
function initPage() {
  user = JB.getCurrentUser();
  if (!user) {
    document.getElementById('loggedOut').style.display = 'block';
    document.getElementById('loggedIn').style.display = 'none';
    return;
  }
  document.getElementById('loggedOut').style.display = 'none';
  document.getElementById('loggedIn').style.display = 'block';

  // 当前角色：优先从 accounts 的 role 字段
  currentRole = user.role || 'technician';
  loadMyRecord();
}

function loadMyRecord() {
  var cfg = ROLE_CONFIG[currentRole];
  if (!cfg) { renderProfilePage(); return; }
  var binKey = cfg.bin;
  JB.get(binKey, function(list) {
    if (!Array.isArray(list)) list = [];
    myRecord = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].accountId === user.id) {
        // 优先取最新的（按 updateTime）
        if (!myRecord || (list[i].updateTime && list[i].updateTime > myRecord.updateTime)) {
          myRecord = list[i];
        }
      }
    }
    renderProfilePage();
  });
}

initPage();
