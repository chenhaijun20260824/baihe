<!DOCTYPE html>
<html lang="zh-CN">
<head
  <meta charset="UTF-8">>
  <script>
/*
 * rose-sync.js — 本地优先同步核心库（取代 jsonbin.js）
 * 架构：本地优先（localStorage 永远可用），可选接入轻量后端做多端同步。
 * 默认不接任何云端：零额度、零网络依赖、不会弹"密钥失败"红条。
 * 多端同步：给 window.RoseSyncAdapter 赋值适配器即可（见 local-api.js 示例）。
 */
var JB = {
  BINS: {
    accounts: 'accounts',
    technicians: 'technicians',
    notices: 'notices',
    audit_log: 'audit_log',
    village_heads: 'village_heads',
    villagers: 'villagers',
    supermarkets: 'supermarkets',
    markets: 'markets',
    factories: 'factories',
    customer_service: 'customer_service',
    sales_managers: 'sales_managers',
    village_agents: 'village_agents',
    town_agents: 'town_agents',
    county_agents: 'county_agents'
  },
  _adapterNow: function () {
    try { return (typeof window !== 'undefined' && window.RoseSyncAdapter) ? window.RoseSyncAdapter : null; }
    catch (e) { return null; }
  },
  _storageKey: function (binKey) { return 'rose_' + binKey; },
  _unwrap: function (v) {
    var depth = 0;
    while (depth < 5 && v && typeof v === 'object' && 'record' in v && Object.keys(v).length <= 2) { v = v.record; depth++; }
    return v;
  },
  _getLocal: function (binKey) {
    try {
      var v = localStorage.getItem(this._storageKey(binKey));
      if (!v) return [];
      return this._unwrap(JSON.parse(v));
    } catch (e) { return []; }
  },
  _setLocal: function (binKey, data) {
    try {
      localStorage.setItem(this._storageKey(binKey), JSON.stringify(data));
      return true;
    } catch (e) {
      if (typeof toast === 'function') toast('本地存储已满，请清理浏览器缓存');
      return false;
    }
  },
  _mergeLists: function (localArr, cloudArr, binKey) {
    var self = this;
    var delSet = {};
    if (binKey) self.getDeleted(binKey).forEach(function (id) { delSet[id] = true; });
    var map = {}, noKey = [];
    function ts(it) { return (it && (it.updateTime || it.time || it.registerTime)) || 0; }
    function keyOf(it) { return it && (it.id || it.account || it.accountId); }
    function isDel(it) { var k = keyOf(it); return k && delSet[k]; }
    function add(it) {
      if (!it || typeof it !== "object") return;
      if (isDel(it)) return;
      var k = keyOf(it);
      if (!k) { noKey.push(it); return; }
      if (!map[k]) map[k] = [it, ts(it)];
      else if (ts(it) > map[k][1]) map[k] = [it, ts(it)];
    }
    (Array.isArray(cloudArr) ? cloudArr : []).forEach(add);
    (Array.isArray(localArr) ? localArr : []).forEach(add);
    var out = [];
    Object.keys(map).forEach(function (k) { out.push(map[k][0]); });
    return out.concat(noKey);
  },
  get: function (binKey, cb) {
    var self = this;
    var local = this._getLocal(binKey);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.pull === "function") {
      var settled = false;
      var finish = function (cloudArr, ok) {
        if (settled) return; settled = true;
        if (ok && Array.isArray(cloudArr)) {
          var merged = self._mergeLists(local, cloudArr, binKey);
          self._setLocal(binKey, merged);
          cb(merged, true, cloudArr);
        } else {
          cb(local, false, local);
        }
      };
      adapter.pull(binKey, finish);
      setTimeout(function () { finish(local, false); }, 2500);
    } else {
      setTimeout(function () { cb(local, true, local); }, 0);
    }
  },
  put: function (binKey, data, cb) {
    this._setLocal(binKey, data);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.push === "function") {
      var settled = false;
      var finish = function (ok) { if (settled) return; settled = true; if (typeof cb === "function") cb(ok); };
      adapter.push(binKey, data, finish);
      setTimeout(function () { finish(false); }, 2500);
    } else {
      if (typeof cb === "function") setTimeout(function () { cb(true); }, 0);
    }
  },
  syncAll: function (cb) {
    var adapter = this._adapterNow();
    if (!adapter) { if (typeof cb === "function") cb(true); return; }
    var self = this, keys = ["accounts", "technicians", "notices", "audit_log"], pending = keys.length;
    function done() { pending--; if (pending <= 0 && typeof cb === "function") cb(true); }
    keys.forEach(function (k) {
      var snapshot = self._getLocal(k);
      self.get(k, function (mergedArr, ok, rawArr) {
        if (!ok) { done(); return; }
        if (!Array.isArray(rawArr)) rawArr = [];
        var merged = self._mergeLists(snapshot, rawArr, k);
        var same = JSON.stringify(merged) === JSON.stringify(rawArr);
        if (same) done();
        else self.put(k, merged, function () { done(); });
      });
    });
  },
  getCurrentUser: function () {
    try { var raw = localStorage.getItem("rose_current_user"); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  genId: function () {
    var ts = Date.now().toString(36);
    var r1 = Math.random().toString(36).slice(2);
    var r2 = "";
    try { r2 = crypto.getRandomValues(new Uint32Array(1))[0].toString(36); }
    catch (e) { r2 = Math.random().toString(36).slice(2); }
    return ts + r1 + r2;
  },
  _deletedKey: function (binKey) { return 'rose_deleted_' + binKey; },
  getDeleted: function (binKey) {
    try { return JSON.parse(localStorage.getItem(this._deletedKey(binKey)) || "[]"); } catch (e) { return []; }
  },
  markDeleted: function (binKey, id) {
    if (!id) return;
    var d = this.getDeleted(binKey);
    if (d.indexOf(id) < 0) d.push(id);
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  },
  unmarkDeleted: function (binKey, id) {
    var d = this.getDeleted(binKey).filter(function (x) { return x !== id; });
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  }
};

// 页面加载后如有适配器则静默同步；纯本地模式下直接 no-op（不联网、不弹窗）
setTimeout(function () { try { JB.syncAll(); } catch (e) {} }, 800);

// 全局错误捕获（保留，便于排查）
window.onerror = function (m, s, l, c) {
  try {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap;";
    d.textContent = "页面报错: " + m + " (" + l + ":" + c + ")";
    (document.body || document.documentElement).appendChild(d);
  } catch (e) {}
  return false;
};
  </script>

  <script>
// ==================== 角色配置 ====================
var ROLE_CONFIG = {
  technician: { name: '技师', icon: '💆', bin: 'technicians' },
  village_head: { name: '村长', icon: '🏘️', bin: 'village_heads' },
  villager: { name: '村民', icon: '🧑‍🌾', bin: 'villagers' },
  supermarket: { name: '超市', icon: '🏪', bin: 'supermarkets' },
  market: { name: '农贸市场', icon: '🥬', bin: 'markets' },
  factory: { name: '企业工厂', icon: '🏭', bin: 'factories' },
  customer_service: { name: '客服', icon: '🎧', bin: 'customer_service' },
  sales_manager: { name: '销售经理', icon: '📊', bin: 'sales_managers' },
  village_agent: { name: '村级代理', icon: '📍', bin: 'village_agents' },
  town_agent: { name: '镇级代理', icon: '📌', bin: 'town_agents' },
  county_agent: { name: '县级代理', icon: '🗺️', bin: 'county_agents' }
};

var ALL_ROLE_KEYS = Object.keys(ROLE_CONFIG);
var currentFilterRole = 'all';
var allPassedItems = []; // 所有已通过记录

function toast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2200);
}

function renderNotice(list) {
  var box = document.getElementById('noticeBox');
  if (!list || list.length === 0) return;
  var sorted = list.slice().sort(function(a,b){ return (b.time||0) - (a.time||0); });
  var n = sorted[0];
  var photosHtml = '';
  if (n.photos && n.photos.length > 0) {
    photosHtml = '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;">';
    for (var pi = 0; pi < n.photos.length; pi++) {
      photosHtml += '<img src="' + n.photos[pi] + '" style="width:80px;height:80px;object-fit:cover;border-radius:8px;" onerror="imgErr(this)">';
    }
    photosHtml += '</div>';
  }
  box.innerHTML = '<div class="notice-box"><div class="notice-title">' + escapeHtml(n.title) + '</div><div style="color:#555;white-space:pre-wrap;line-height:1.6;">' + escapeHtml(n.content) + '</div>' + photosHtml + '</div>';
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function renderRoleTabs() {
  var tabsEl = document.getElementById('roleTabs');
  var html = '<div class="role-tab' + (currentFilterRole === 'all' ? ' active' : '') + '" onclick="filterByRole(\'all\')">全部 <span class="role-tab-count">' + allPassedItems.length + '</span></div>';
  ALL_ROLE_KEYS.forEach(function(key) {
    var cfg = ROLE_CONFIG[key];
    // count 时若 item.role 为空（历史数据），按 id 前缀推算
    var count = 0;
    allPassedItems.forEach(function(it) {
      var r = it.role;
      if (!r && it.id) {
        if (it.id.indexOf('vh_')===0) r = 'village_head';
        else if (it.id.indexOf('t_')===0) r = 'technician';
        else if (it.id.indexOf('v_')===0) r = 'villager';
        else if (it.id.indexOf('s_')===0) r = 'supermarket';
        else if (it.id.indexOf('m_')===0) r = 'market';
        else if (it.id.indexOf('f_')===0) r = 'factory';
      }
      if (r === key) count++;
    });
    var cls = currentFilterRole === key ? ' active' : '';
    var countTxt = count > 0 ? count : '\u00b7';
    html += '<div class="role-tab' + cls + '" onclick="filterByRole(\'' + key + '\')">' + cfg.icon + ' ' + cfg.name + ' <span class="role-tab-count">' + countTxt + '</span></div>';
  });
  tabsEl.innerHTML = html;
}
function filterByRole(role) {
  currentFilterRole = role;
  renderRoleTabs();
  renderAllItems();
}

function getItemKey(item) {
  return item.id || item.accountId || item.account || '';
}

function getDetailUrl(item) {
  var key = getItemKey(item);
  return 'technician-detail.html?v=20260916&type=' + encodeURIComponent(item.role || 'technician') + '&id=' + encodeURIComponent(key);
}

function getItemTitle(item) {
  // 不同角色的主标题字段
  if (item.role === 'technician') return item.name || '技师';
  if (item.role === 'village_head') return item.name ? (item.name + '（村长）') : '村长';
  if (item.role === 'villager') return item.name || '村民';
  if (item.role === 'supermarket') return item.marketName || item.name || '超市';
  if (item.role === 'market') return item.marketName || item.name || '农贸市场';
  if (item.role === 'factory') return item.factoryName || item.name || '企业工厂';
  if (item.role === 'customer_service') return item.name ? (item.name + '（客服）') : '客服';
  if (item.role === 'sales_manager') return item.name ? (item.name + '（销售经理）') : '销售经理';
  if (item.role === 'village_agent') return item.agentName || item.name || '村级代理';
  if (item.role === 'town_agent') return item.agentName || item.name || '镇级代理';
  if (item.role === 'county_agent') return item.agentName || item.name || '县级代理';
  return item.name || '未知';
}

function getItemSub(item) {
  var parts = [];
  if (item.province || item.city || item.county) parts.push([item.province, item.city, item.county].filter(Boolean).join(''));
  if (item.village) parts.push(item.village + '村');
  if (item.town) parts.push(item.town + '镇');
  if (item.address) parts.push(item.address);
  return parts.join(' · ') || '未填地址';
}

function getItemExtra(item) {
  if (item.role === 'technician') return '¥' + (item.price || '?') + ' / 次';
  if (item.role === 'villager') {
    var extras = [];
    if (item.products && item.products.length) extras.push('农产品' + item.products.length + '种');
    if (item.crafts && item.crafts.length) extras.push('手工' + item.crafts.length + '种');
    if (item.skills && item.skills.length) extras.push('技能' + item.skills.length + '项');
    if (item.jobStatus) extras.push(item.jobStatus);
    return extras.join(' · ') || '';
  }
  if (item.role === 'factory') {
    var fExtras = [];
    if (item.jobs && item.jobs.length) fExtras.push('招工' + item.jobs.length + '个岗位');
    if (item.farmDemand) fExtras.push('需农产品');
    return fExtras.join(' · ') || '';
  }
  if (item.role === 'town_agent' || item.role === 'county_agent') {
    var aExtras = [];
    if (item.developedCount) aExtras.push('发展' + item.developedCount + '人');
    if (item.developedFactoriesCount) aExtras.push('发展' + item.developedFactoriesCount + '家工厂');
    return aExtras.join(' · ') || '';
  }
  if (item.role === 'village_agent') {
    return item.developedCount ? '发展' + item.developedCount + '人' : '';
  }
  return '';
}


function cleanLocalDirtyData() {
  var bins = ['technicians', 'village_heads', 'villagers', 'supermarkets', 'markets', 'factories', 'customer_service', 'sales_managers', 'village_agents', 'town_agents', 'county_agents'];
  bins.forEach(function(bin) {
    try {
      var key = 'rose_' + bin;
      var raw = localStorage.getItem(key);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return;
      var filtered = arr.filter(function(it) {
        if (!it || !it.id) return false;
        var nm = it.name || it.marketName || it.agentName || it.factoryName || '';
        if (!nm || nm.indexOf('<<') >= 0 || nm.indexOf('vid') >= 0 || nm.length < 2) return false;
        return true;
      });
      if (filtered.length !== arr.length) {
        localStorage.setItem(key, JSON.stringify(filtered));
      }
    } catch(e) {}
  });
}


function cleanLocalDirtyData() {
  var bins = ['technicians', 'village_heads', 'villagers', 'supermarkets', 'markets', 'factories', 'customer_service', 'sales_managers', 'village_agents', 'town_agents', 'county_agents'];
  bins.forEach(function(bin) {
    try {
      var key = 'rose_' + bin;
      var raw = localStorage.getItem(key);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return;
      var filtered = arr.filter(function(it) {
        if (!it || !it.id) return false;
        var nm = it.name || it.marketName || it.agentName || it.factoryName || '';
        if (!nm || nm.indexOf('<<') >= 0 || nm.indexOf('vid') >= 0 || nm.length < 2) return false;
        return true;
      });
      if (filtered.length !== arr.length) {
        localStorage.setItem(key, JSON.stringify(filtered));
      }
    } catch(e) {}
  });
}

function formatDate(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  var hh = String(d.getHours()).padStart(2, '0');
  var mi = String(d.getMinutes()).padStart(2, '0');
  return y + '-' + m + '-' + dd + ' ' + hh + ':' + mi;
}

function getRoleIcon(role) {
  var cfg = ROLE_CONFIG[role];
  return cfg ? cfg.icon : '👤';
}

function getRoleName(role) {

  return cfg ? cfg.name : role;
}

function renderCard(item, isNew) {
  // 防御：过滤无效数据
  if (!item || typeof item !== 'object') return '';
  var _name = getItemTitle(item);
  if (!_name || _name.indexOf('<<') >= 0 || _name.indexOf('vid') >= 0 || _name.length < 2 || _name === '未知') return '';
  
  var key = getItemKey(item);
  if (!key) return '';
  var now = Date.now();
  var sevenDays = 7 * 24 * 60 * 60 * 1000;
  var isRecent = item.auditTime && ((now - item.auditTime) <= sevenDays);
  var photosHtml = '';
  if (item.photos && item.photos.length > 0) {
    for (var pi = 0; pi < item.photos.length; pi++) {
      photosHtml += '<img src="' + escapeHtml(item.photos[pi]) + '" onerror="imgErr(this)">';
    }
  } else {
    var icon = getRoleIcon(item.role || 'technician');
    photosHtml = '<div style="display:flex;height:70px;">' +
      '<div style="flex:1;background:#fce4ec;display:flex;align-items:center;justify-content:center;color:#C2185B;font-size:28px;">' + icon + '</div>' +
      '<div style="flex:1;background:#fce4ec;display:flex;align-items:center;justify-content:center;color:#C2185B;font-size:28px;">' + icon + '</div>' +
      '<div style="flex:1;background:#fce4ec;display:flex;align-items:center;justify-content:center;color:#C2185B;font-size:28px;">' + icon + '</div>' +
      '</div>';
  }
  var img = '<div class="tech-photos">' + photosHtml + '</div>';
  var badge = (isNew && isRecent) ? '<span class="new-badge">新</span>' : '';
  var roleBadge = item.role && item.role !== 'technician' ? '<span class="role-badge">' + getRoleIcon(item.role) + '</span>' : '';
  var title = getItemTitle(item);
  var sub = getItemSub(item);
  var extra = getItemExtra(item);
  return '<div class="tech-card" onclick="location.href=\'' + getDetailUrl(item) + '\'">' +
    img +
    '<div class="tech-card-body">' +
      '<div class="tech-name">' + escapeHtml(title) + badge + roleBadge + '</div>' +
      '<div class="tech-meta">📍 ' + escapeHtml(sub) + '</div>' +
      (item.phone ? '<div class="tech-meta">📞 ' + escapeHtml(item.phone) + '</div>' : '') +
      (extra ? '<div class="tech-price">' + escapeHtml(extra) + '</div>' : '') +
    (item.submitTime ? '<div class="tech-meta" style="font-size:11px;color:#999;">✍️ 申请：' + formatDate(item.submitTime) + '</div>' : '') +
    (item.auditTime ? '<div class="tech-meta" style="font-size:11px;color:#999;">✅ 上线：' + formatDate(item.auditTime) + '</div>' : '') +
    '</div>' +
  '</div>';
}

function renderAllItems() {
  var newBox = document.getElementById('newBox');
  var techBox = document.getElementById('techBox');
  var newTitle = document.getElementById('newSectionTitle');
  var mainTitle = document.getElementById('mainSectionTitle');
  var searchTip = document.getElementById('searchTip');
  var q = (document.getElementById('searchInput') || {}).value || '';

  // 过滤
  // 兜底推断 role：历史数据可能没 role 字段，按 id 前缀推算
  allPassedItems.forEach(function(it) {
    if (!it.role && it.id) {
      if (it.id.indexOf('vh_')===0) it.role = 'village_head';
      else if (it.id.indexOf('t_')===0) it.role = 'technician';
      else if (it.id.indexOf('v_')===0) it.role = 'villager';
      else if (it.id.indexOf('s_')===0) it.role = 'supermarket';
      else if (it.id.indexOf('m_')===0) it.role = 'market';
      else if (it.id.indexOf('f_')===0) it.role = 'factory';
    }
  });
  // 双保险：过滤无效 name
  allPassedItems = allPassedItems.filter(function(t) {
    var nm = getItemTitle(t);
    return nm && nm.indexOf('<<') < 0 && nm.indexOf('vid') < 0 && nm !== '\u672a\u77e5' && nm.length >= 2;
  });
  // 兜底推断 role：历史数据可能没 role 字段，按 id 前缀推算
  allPassedItems.forEach(function(it) {
    if (!it.role && it.id) {
      if (it.id.indexOf('vh_')===0) it.role = 'village_head';
      else if (it.id.indexOf('t_')===0) it.role = 'technician';
      else if (it.id.indexOf('v_')===0) it.role = 'villager';
      else if (it.id.indexOf('s_')===0) it.role = 'supermarket';
      else if (it.id.indexOf('m_')===0) it.role = 'market';
      else if (it.id.indexOf('f_')===0) it.role = 'factory';
    }
  });
  // 双保险：过滤无效 name
  allPassedItems = allPassedItems.filter(function(t) {
    var nm = getItemTitle(t);
    return nm && nm.indexOf('<<') < 0 && nm.indexOf('vid') < 0 && nm !== '\u672a\u77e5' && nm.length >= 2;
  });
  var filtered = allPassedItems;
  if (currentFilterRole !== 'all') {
    filtered = filtered.filter(function(t) { return t.role === currentFilterRole; });
  }
  if (q.trim()) {
    var qq = q.trim().toLowerCase();
    filtered = filtered.filter(function(t) {
      var hay = [getItemTitle(t), getItemSub(t), t.phone || '', t.name || ''].join(' ').toLowerCase();
      return hay.indexOf(qq) >= 0;
    });
  }

  var now = Date.now();
  var sevenDays = 7 * 24 * 60 * 60 * 1000;
  var recent = filtered.filter(function(t) { return t.auditTime && ((now - t.auditTime) <= sevenDays); });
  var older = filtered.filter(function(t) { return !t.auditTime || ((now - t.auditTime) > sevenDays); });

  // 置顶排序
  function sortByTop(arr) {
    return arr.slice().sort(function(a, b) {
      var at = a.top || 0, bt = b.top || 0;
      if (at && bt) return bt - at;
      if (at) return -1;
      if (bt) return 1;
      return 0;
    });
  }

  if (q.trim()) {
    if (newTitle) newTitle.style.display = 'none';
    if (newBox) newBox.innerHTML = '';
    if (techBox) techBox.innerHTML = filtered.length > 0
      ? filtered.map(function(t) { return renderCard(t, false); }).join('')
      : '<div class="empty">未找到匹配的记录，换个关键词试试</div>';
    if (searchTip) { searchTip.style.display = 'block'; searchTip.textContent = '🔍 找到 ' + filtered.length + ' 条匹配记录'; }
  } else {
    if (searchTip) searchTip.style.display = 'none';
    recent = sortByTop(recent);
    older = sortByTop(older);
    if (newTitle) newTitle.style.display = recent.length > 0 ? '' : 'none';
    if (newBox) newBox.innerHTML = recent.length > 0
      ? recent.map(function(t) { return renderCard(t, true); }).join('')
      : '<div class="empty">暂无新人上线</div>';
    if (techBox) techBox.innerHTML = older.length > 0
      ? older.map(function(t) { return renderCard(t, false); }).join('')
      : '<div class="empty">暂无其他记录</div>';
  }
}

function refreshHome() {
  cleanLocalDirtyData();
  cleanLocalDirtyData();
  // 加载所有角色的已通过数据
  var allKeys = ALL_ROLE_KEYS.map(function(k) { return ROLE_CONFIG[k].bin; });
  var loaded = 0;
  allPassedItems = [];
  allKeys.forEach(function(binKey) {
    JB.get(binKey, function(data) {
      if (Array.isArray(data)) {
        data.forEach(function(item) {
          if (item.status === '已通过') {
            // 过滤无效 name（含 << / vid / 未知 / 长度<2）
            var t = getItemTitle(item);
            if (!t || t.indexOf('<<') >= 0 || t.indexOf('vid') >= 0 || t === '未知' || t.length < 2) return;
            allPassedItems.push(item);
          }
        });
      }
      loaded++;
      if (loaded === allKeys.length) {
        // 按 id 去重（保留 updateTime 最大的）
        var seen = {};
        var dedup = [];
        allPassedItems.forEach(function(it) {
          var k = it.id || (it.accountId + '_' + (it.role || 'technician'));
          if (!seen[k]) {
            seen[k] = it;
            dedup.push(it);
          } else if (it.updateTime && it.updateTime > seen[k].updateTime) {
            var idx = dedup.indexOf(seen[k]);
            if (idx >= 0) dedup.splice(idx, 1);
            seen[k] = it;
            dedup.push(it);
          }
        });
        allPassedItems = dedup;
        renderRoleTabs();
        renderAllItems();
      }
    });
  });
  JB.get('notices', function(data) {
    if (Array.isArray(data)) renderNotice(data);
  });
}
function init() {
  refreshHome();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshHome(); });
  window.addEventListener('pageshow', function () { refreshHome(); });
}

function testToken(tk, cb) {
  fetch('https://api.github.com/repos/chenhaijun20260824/baihe-data', {
    headers: { 'Authorization': 'token ' + tk, 'Accept': 'application/vnd.github+json' }
  }).then(function(r){ cb(r.ok); }).catch(function(){ cb(false); });
}
function doConnectFromModal() {
  var i = document.getElementById('cloudTokenInput');
  var t = i ? i.value.trim() : '';
  if (!t) { toast('请输入连接码'); return; }
  toast('正在验证连接码…');
  testToken(t, function(ok){
    if (!ok) { toast('连接码无效或无权限访问仓库 ✗'); return; }
    var def = (typeof window !== 'undefined' && window.BAIHE_CLOUD) || {};
    localStorage.setItem('百合_cloud_cfg', JSON.stringify({
      token: t,
      owner: def.owner || 'chenhaijun20260824',
      repo: def.repo || 'baihe-data',
      branch: def.branch || 'main',
      path: def.path || 'data'
    }));
    closeCloudModal();
    toast('已连接，正在同步…');
    setTimeout(function(){ location.reload(); }, 700);
  });
}

}

function forceSyncNow() {

  JB.syncAll(function(){

function copyConnectCode() {
  var cfg = null;
  try { cfg = JSON.parse(localStorage.getItem('百合_cloud_cfg') || '{}'); } catch (e) {}
  if (!cfg || !cfg.token) { toast('未找到连接码'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(cfg.token).then(function(){ toast('连接码已复制 ✓'); }, function(){ toast('复制失败，请手动复制'); });
  } else {
    var ta = document.createElement('textarea'); ta.value = cfg.token; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('连接码已复制 ✓'); } catch(e){ toast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  }
}
function disconnectCloud() {
  localStorage.removeItem('百合_cloud_cfg');
  localStorage.removeItem('百合_server_online');
  closeCloudModal();
  toast('已断开云端');
  setTimeout(function(){ location.reload(); }, 700);
}
