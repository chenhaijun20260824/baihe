<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
/*
 * rose-sync.js — 本地优先同步核心库（取代 jsonbin.js）
 * 架构：本地优先（localStorage 永远可用），可选接入轻量后端做多端同步。
 * 默认不接任何云端：零额度、零网络依赖、不会弹"密钥失败"红条。
 * 多端同步：给 window.RoseSyncAdapter 赋值适配器即可（见 local-api.js 示例）。
 */
var JB = {
  BINS: { accounts: 'accounts', technicians: 'technicians', notices: 'notices', audit_log: 'audit_log' },
  _adapterNow: function () {
    try { return (typeof window !== 'undefined' && window.RoseSyncAdapter) ? window.RoseSyncAdapter : null; }
    catch (e) { return null; }
  },
  _storageKey: function (binKey) { return 'rose_' + binKey; },
  _unwrap: function (v) {
    var depth = 0;
    while (depth < 5 && v && typeof v === 'object' && 'record' in v && Object.keys(v).length <= 2) { v = v.record; depth++; }
    return v;
  },
  _getLocal: function (binKey) {
    try {
      var v = localStorage.getItem(this._storageKey(binKey));
      if (!v) return [];
      return this._unwrap(JSON.parse(v));
    } catch (e) { return []; }
  },
  _setLocal: function (binKey, data) {
    try {
      localStorage.setItem(this._storageKey(binKey), JSON.stringify(data));
      return true;
    } catch (e) {
      if (typeof toast === 'function') toast('本地存储已满，请清理浏览器缓存');
      return false;
    }
  },
  _mergeLists: function (localArr, cloudArr, binKey) {
    var self = this;
    var delSet = {};
    if (binKey) self.getDeleted(binKey).forEach(function (id) { delSet[id] = true; });
    var map = {}, noKey = [];
    function ts(it) { return (it && (it.updateTime || it.time || it.registerTime)) || 0; }
    function keyOf(it) { return it && (it.id || it.account || it.accountId); }
    function isDel(it) { var k = keyOf(it); return k && delSet[k]; }
    function add(it) {
      if (!it || typeof it !== "object") return;
      if (isDel(it)) return;
      var k = keyOf(it);
      if (!k) { noKey.push(it); return; }
      if (!map[k]) map[k] = [it, ts(it)];
      else if (ts(it) > map[k][1]) map[k] = [it, ts(it)];
    }
    (Array.isArray(cloudArr) ? cloudArr : []).forEach(add);
    (Array.isArray(localArr) ? localArr : []).forEach(add);
    var out = [];
    Object.keys(map).forEach(function (k) { out.push(map[k][0]); });
    return out.concat(noKey);
  },
  get: function (binKey, cb) {
    var self = this;
    var local = this._getLocal(binKey);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.pull === "function") {
      var settled = false;
      var finish = function (cloudArr, ok) {
        if (settled) return; settled = true;
        if (ok && Array.isArray(cloudArr)) {
          var merged = self._mergeLists(local, cloudArr, binKey);
          self._setLocal(binKey, merged);
          cb(merged, true, cloudArr);
        } else {
          cb(local, false, local);
        }
      };
      adapter.pull(binKey, finish);
      setTimeout(function () { finish(local, false); }, 2500);
    } else {
      setTimeout(function () { cb(local, true, local); }, 0);
    }
  },
  put: function (binKey, data, cb) {
    this._setLocal(binKey, data);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.push === "function") {
      var settled = false;
      var finish = function (ok) { if (settled) return; settled = true; if (typeof cb === "function") cb(ok); };
      adapter.push(binKey, data, finish);
      setTimeout(function () { finish(false); }, 2500);
    } else {
      if (typeof cb === "function") setTimeout(function () { cb(true); }, 0);
    }
  },
  syncAll: function (cb) {
    var adapter = this._adapterNow();
    if (!adapter) { if (typeof cb === "function") cb(true); return; }
    var self = this, keys = ["accounts", "technicians", "notices", "audit_log"], pending = keys.length;
    function done() { pending--; if (pending <= 0 && typeof cb === "function") cb(true); }
    keys.forEach(function (k) {
      var snapshot = self._getLocal(k);
      self.get(k, function (mergedArr, ok, rawArr) {
        if (!ok) { done(); return; }
        if (!Array.isArray(rawArr)) rawArr = [];
        var merged = self._mergeLists(snapshot, rawArr, k);
        var same = JSON.stringify(merged) === JSON.stringify(rawArr);
        if (same) done();
        else self.put(k, merged, function () { done(); });
      });
    });
  },
  getCurrentUser: function () {
    try { var raw = localStorage.getItem("rose_current_user"); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  genId: function () {
    var ts = Date.now().toString(36);
    var r1 = Math.random().toString(36).slice(2);
    var r2 = "";
    try { r2 = crypto.getRandomValues(new Uint32Array(1))[0].toString(36); }
    catch (e) { r2 = Math.random().toString(36).slice(2); }
    return ts + r1 + r2;
  },
  _deletedKey: function (binKey) { return 'rose_deleted_' + binKey; },
  getDeleted: function (binKey) {
    try { return JSON.parse(localStorage.getItem(this._deletedKey(binKey)) || "[]"); } catch (e) { return []; }
  },
  markDeleted: function (binKey, id) {
    if (!id) return;
    var d = this.getDeleted(binKey);
    if (d.indexOf(id) < 0) d.push(id);
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  },
  unmarkDeleted: function (binKey, id) {
    var d = this.getDeleted(binKey).filter(function (x) { return x !== id; });
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  }
};

// 页面加载后如有适配器则静默同步；纯本地模式下直接 no-op（不联网、不弹窗）
setTimeout(function () { try { JB.syncAll(); } catch (e) {} }, 800);

// 全局错误捕获（保留，便于排查）
window.onerror = function (m, s, l, c) {
  try {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap;";
    d.textContent = "页面报错: " + m + " (" + l + ":" + c + ")";
    (document.body || document.documentElement).appendChild(d);
  } catch (e) {}
  return false;
};

/*
 * 可选多端同步：在引入本文件之后、页面逻辑之前设置 window.RoseSyncAdapter 即可，
 * 例如 local-api.js。本地永远优先，后端不可用也不影响本机数据。
 */
</script>


  <title>技师详情 - 百合上门</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #FFF5F7; color: #333; min-height: 100vh; padding-bottom: 70px; }
    .header { background: linear-gradient(135deg, #C2185B, #E91E63); color: #fff; padding: 14px 16px; font-size: 17px; font-weight: bold; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 50; }
    .header .back { cursor: pointer; font-size: 20px; text-decoration: none; color: #fff; }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .gallery { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; }
    .gallery img { width: 100%; max-width: 280px; height: 220px; object-fit: cover; border-radius: 12px; flex-shrink: 0; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .name { font-size: 20px; font-weight: bold; color: #C2185B; }
    .field { font-size: 14px; margin: 10px 0; line-height: 1.6; }
    .field b { color: #C2185B; }
    .price-big { font-size: 22px; font-weight: bold; color: #C2185B; }
    .services-box { background: #FFF3F6; border-radius: 10px; padding: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
    .call-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: #fff; border-top: 1px solid #eee; }
    .call-bar a { display: block; text-align: center; padding: 13px; background: linear-gradient(135deg,#C2185B,#E91E63); color: #fff; border-radius: 10px; font-size: 16px; font-weight: bold; text-decoration: none; }
    .empty { text-align: center; color: #bbb; padding: 40px; }
    .loading { text-align: center; color: #bbb; padding: 40px; }
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.8); color: #fff; padding: 12px 28px; border-radius: 10px; font-size: 14px; z-index: 99999; pointer-events: none; white-space: nowrap; }
  </style>
  <link rel="manifest" href="manifest.json?v=20260817">
  <meta name="theme-color" content="#C2185B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%23C2185B' width='192' height='192' rx='24'/%3E%3Ctext x='96' y='120' font-size='80' text-anchor='middle'%3E🌹%3C/text%3E%3C/svg%3E">
<script>
window.imgErr = function(img) {
  try {
    img.onerror = null;
    img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 280 220'><rect width='280' height='220' fill='%23fce4ec'/><text x='140' y='125' font-size='40' text-anchor='middle' fill='%23C2185B'>暂无图片</text></svg>";
  } catch (e) {}
};
</script>
</head>
<body>
  <div class="header"><a class="back" href="index.html?v=20260817">←</a> 技师详情</div>
  <div class="container" id="content"><div class="loading">加载中...</div></div>
  <div class="call-bar" id="callBar" style="display:none;"></div>

<script>
function toast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2200);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function getParam(name) {
  var reg = new RegExp('[?&]' + name + '=([^&]*)');
  var m = location.search.match(reg);
  return m ? decodeURIComponent(m[1]) : '';
}

function render(t) {
  var imgs = (t.photos || []).map(function(p) {
    return '<img src="' + escapeHtml(p) + '" onerror="imgErr(this)">';
  }).join('') || '<div style="color:#bbb;padding:40px;text-align:center;">暂无照片</div>';

  var servicesText = t.services || '暂无';
  document.getElementById('content').innerHTML =
    '<div class="gallery">' + imgs + '</div>' +
    '<div class="card">' +
      '<div class="name">' + escapeHtml(t.name) + '</div>' +
      '<div class="field"><b>服务价格：</b><span class="price-big">¥' + escapeHtml(t.price) + '</span> / 次</div>' +
      '<div class="field"><b>联系电话：</b>' + escapeHtml(t.phone) + '</div>' +
      '<div class="field"><b>服务地址：</b>' + escapeHtml(t.address || '未填') + '</div>' +
      '<div class="field"><b>服务项目：</b></div>' +
      '<div class="services-box">' + escapeHtml(servicesText) + '</div>' +
    '</div>';
  document.getElementById('callBar').style.display = 'block';
  document.getElementById('callBar').innerHTML =
    '<a href="tel:' + escapeHtml(t.phone) + '">📞 立即预约 ' + escapeHtml(t.phone) + '</a>';
}

function matchTech(t, id) {
  return t && (t.id === id || t.accountId === id || t.account === id);
}

(function() {
  var id = getParam('id') || getParam('accountId') || getParam('account');
  if (!id) {
    // 未直接传入 ID：列出全部已通过技师，供点击进入（避免“缺少技师ID”死路）
    document.getElementById('content').innerHTML = '<div class="loading">加载中...</div>';
    JB.get('technicians', function(list) {
      if (!Array.isArray(list)) list = [];
      var passed = list.filter(function(t) { return t && t.status === '已通过'; });
      if (passed.length === 0) {
        document.getElementById('content').innerHTML = '<div class="empty">暂无技师数据<br><br><a href="index.html" style="color:#C2185B;text-decoration:none;">← 返回首页</a></div>';
        return;
      }
      var html = passed.map(function(t) {
        var key = t.id || t.accountId || t.account || '';
        return '<div class="card" style="cursor:pointer;" onclick="location.href=\'technician-detail.html?v=20260817&id=' + encodeURIComponent(key) + '\'">'
          + '<div class="name">' + escapeHtml(t.name) + '</div>'
          + '<div class="field"><b>联系电话：</b>' + escapeHtml(t.phone) + '</div>'
          + '<div class="field"><b>服务地址：</b>' + escapeHtml(t.address || '未填') + '</div>'
          + '</div>';
      }).join('');
      document.getElementById('content').innerHTML = '<div style="padding:10px 0 4px;color:#C2185B;font-weight:bold;">请选择技师：</div>' + html;
    });
    return;
  }

  // 先从本地快速展示，再从云端更新
  var local = JB._getLocal('technicians');
  var t = null;
  for (var i = 0; i < local.length; i++) {
    if (matchTech(local[i], id) && local[i].status === '已通过') { t = local[i]; break; }
  }
  if (t) render(t);

  // 从云端拉取最新数据，有差异则更新本地并刷新显示
  JB.get('technicians', function(list) {
    if (!Array.isArray(list)) return;
    for (var i = 0; i < list.length; i++) {
      if (matchTech(list[i], id) && list[i].status === '已通过') {
        var cloud = list[i];
        if (!t || JSON.stringify(t) !== JSON.stringify(cloud)) {
          render(cloud);
        }
        break;
      }
    }
  });
})();
</script>
<script src="local-api.js"></script>
</body>
</html>
