<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
/*
 * rose-sync.js — 本地优先同步核心库
 */
var JB = {
  BINS: {
    accounts: 'accounts',
    technicians: 'technicians',
    notices: 'notices',
    audit_log: 'audit_log',
    village_heads: 'village_heads',
    villagers: 'villagers',
    supermarkets: 'supermarkets',
    markets: 'markets',
    factories: 'factories',
    customer_service: 'customer_service',
    sales_managers: 'sales_managers',
    village_agents: 'village_agents',
    town_agents: 'town_agents',
    county_agents: 'county_agents'
  },
  _adapterNow: function () {
    try { return (typeof window !== 'undefined' && window.RoseSyncAdapter) ? window.RoseSyncAdapter : null; }
    catch (e) { return null; }
  },
  _storageKey: function (binKey) { return 'rose_' + binKey; },
  _unwrap: function (v) {
    var depth = 0;
    while (depth < 5 && v && typeof v === 'object' && 'record' in v && Object.keys(v).length <= 2) { v = v.record; depth++; }
    return v;
  },
  _getLocal: function (binKey) {
    try {
      var v = localStorage.getItem(this._storageKey(binKey));
      if (!v) return [];
      return this._unwrap(JSON.parse(v));
    } catch (e) { return []; }
  },
  _setLocal: function (binKey, data) {
    try {
      localStorage.setItem(this._storageKey(binKey), JSON.stringify(data));
      return true;
    } catch (e) {
      if (typeof toast === 'function') toast('本地存储已满，请清理浏览器缓存');
      return false;
    }
  },
  _mergeLists: function (localArr, cloudArr, binKey) {
    var self = this;
    var delSet = {};
    if (binKey) self.getDeleted(binKey).forEach(function (id) { delSet[id] = true; });
    var map = {}, noKey = [];
    function ts(it) { return (it && (it.updateTime || it.time || it.registerTime)) || 0; }
    function keyOf(it) { return it && (it.id || it.account || it.accountId); }
    function isDel(it) { var k = keyOf(it); return k && delSet[k]; }
    function add(it) {
      if (!it || typeof it !== "object") return;
      if (isDel(it)) return;
      var k = keyOf(it);
      if (!k) { noKey.push(it); return; }
      if (!map[k]) map[k] = [it, ts(it)];
      else if (ts(it) > map[k][1]) map[k] = [it, ts(it)];
    }
    (Array.isArray(cloudArr) ? cloudArr : []).forEach(add);
    (Array.isArray(localArr) ? localArr : []).forEach(add);
    var out = [];
    Object.keys(map).forEach(function (k) { out.push(map[k][0]); });
    return out.concat(noKey);
  },
  get: function (binKey, cb) {
    var self = this;
    var local = this._getLocal(binKey);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.pull === "function") {
      var settled = false;
      var finish = function (cloudArr, ok) {
        if (settled) return; settled = true;
        if (ok && Array.isArray(cloudArr)) {
          var merged = self._mergeLists(local, cloudArr, binKey);
          self._setLocal(binKey, merged);
          cb(merged, true, cloudArr);
        } else {
          cb(local, false, local);
        }
      };
      adapter.pull(binKey, finish);
      setTimeout(function () { finish(local, false); }, 2500);
    } else {
      setTimeout(function () { cb(local, true, local); }, 0);
    }
  },
  put: function (binKey, data, cb) {
    this._setLocal(binKey, data);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.push === "function") {
      var settled = false;
      var finish = function (ok) { if (settled) return; settled = true; if (typeof cb === "function") cb(ok); };
      adapter.push(binKey, data, finish);
      setTimeout(function () { finish(false); }, 2500);
    } else {
      if (typeof cb === "function") setTimeout(function () { cb(true); }, 0);
    }
  },
  syncAll: function (cb) {
    var adapter = this._adapterNow();
    if (!adapter) { if (typeof cb === "function") cb(true); return; }
    var self = this, keys = ["accounts", "technicians", "notices", "audit_log"], pending = keys.length;
    function done() { pending--; if (pending <= 0 && typeof cb === "function") cb(true); }
    keys.forEach(function (k) {
      var snapshot = self._getLocal(k);
      self.get(k, function (mergedArr, ok, rawArr) {
        if (!ok) { done(); return; }
        if (!Array.isArray(rawArr)) rawArr = [];
        var merged = self._mergeLists(snapshot, rawArr, k);
        var same = JSON.stringify(merged) === JSON.stringify(rawArr);
        if (same) done();
        else self.put(k, merged, function () { done(); });
      });
    });
  },
  getCurrentUser: function () {
    try { var raw = localStorage.getItem("rose_current_user"); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  genId: function () {
    var ts = Date.now().toString(36);
    var r1 = Math.random().toString(36).slice(2);
    var r2 = "";
    try { r2 = crypto.getRandomValues(new Uint32Array(1))[0].toString(36); }
    catch (e) { r2 = Math.random().toString(36).slice(2); }
    return ts + r1 + r2;
  },
  _deletedKey: function (binKey) { return 'rose_deleted_' + binKey; },
  getDeleted: function (binKey) {
    try { return JSON.parse(localStorage.getItem(this._deletedKey(binKey)) || "[]"); } catch (e) { return []; }
  },
  markDeleted: function (binKey, id) {
    if (!id) return;
    var d = this.getDeleted(binKey);
    if (d.indexOf(id) < 0) d.push(id);
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  },
  unmarkDeleted: function (binKey, id) {
    var d = this.getDeleted(binKey).filter(function (x) { return x !== id; });
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  }
};
setTimeout(function () { try { JB.syncAll(); } catch (e) {} }, 800);
window.onerror = function (m, s, l, c) {
  try {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap;";
    d.textContent = "页面报错: " + m + " (" + l + ":" + c + ")";
    (document.body || document.documentElement).appendChild(d);
  } catch (e) {}
  return false;
};
  </script>

<script>
var ROLE_CONFIG = {
  technician: { name: '技师', icon: '💆', bin: 'technicians' },
  village_head: { name: '村长', icon: '🏘️', bin: 'village_heads' },
  villager: { name: '村民', icon: '🧑‍🌾', bin: 'villagers' },
  supermarket: { name: '超市', icon: '🏪', bin: 'supermarkets' },
  market: { name: '农贸市场', icon: '🥬', bin: 'markets' },
  factory: { name: '企业工厂', icon: '🏭', bin: 'factories' },
  customer_service: { name: '客服', icon: '🎧', bin: 'customer_service' },
  sales_manager: { name: '销售经理', icon: '📊', bin: 'sales_managers' },
  village_agent: { name: '村级代理', icon: '📍', bin: 'village_agents' },
  town_agent: { name: '镇级代理', icon: '📌', bin: 'town_agents' },
  county_agent: { name: '县级代理', icon: '🗺️', bin: 'county_agents' }
};

function toast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2200);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function getParam(name) {
  var reg = new RegExp('[?&]' + name + '=([^&]*)');
  var m = location.search.match(reg);
  return m ? decodeURIComponent(m[1]) : '';
}

function getRoleIcon(role) {
  var cfg = ROLE_CONFIG[role];
  return cfg ? cfg.icon : '👤';
}

function getRoleName(role) {
  var cfg = ROLE_CONFIG[role];
  return cfg ? cfg.name : role;
}

function getItemTitle(item) {
  var r = item.role || 'technician';
  if (r === 'technician') return item.name || '技师';
  if (r === 'village_head') return (item.name || '村长') + '（村长）';
  if (r === 'villager') return item.name || '村民';
  if (r === 'supermarket') return item.marketName || item.name || '超市';
  if (r === 'market') return item.marketName || item.name || '农贸市场';
  if (r === 'factory') return item.factoryName || item.name || '企业工厂';
  if (r === 'customer_service') return (item.name || '客服') + '（客服）';
  if (r === 'sales_manager') return (item.name || '销售经理') + '（销售经理）';
  if (r === 'village_agent') return item.agentName || item.name || '村级代理';
  if (r === 'town_agent') return item.agentName || item.name || '镇级代理';
  if (r === 'county_agent') return item.agentName || item.name || '县级代理';
  return item.name || r;
}

function getLocation(item) {
  var parts = [];
  if (item.province) parts.push(item.province);
  if (item.city) parts.push(item.city);
  if (item.county) parts.push(item.county);
  if (item.town) parts.push(item.town + '镇');
  if (item.village) parts.push(item.village + '村');
  if (item.address) parts.push(item.address);
  return parts.join(' ') || '未填地址';
}

function render(item) {
  if (!item) return;
  var r = item.role || 'technician';
  var cfg = ROLE_CONFIG[r];
  var title = getItemTitle(item);

  document.getElementById('headerTitle').textContent = getRoleName(r) + '详情';

  // 相册
  var imgs = '';
  if (item.photos && item.photos.length > 0) {
    for (var pi = 0; pi < item.photos.length; pi++) {
      imgs += '<img src="' + escapeHtml(item.photos[pi]) + '" onerror="imgErr(this)">';
    }
  } else {
    imgs = '<div style="height:180px;background:#fce4ec;display:flex;align-items:center;justify-content:center;color:#C2185B;font-size:60px;">' + getRoleIcon(r) + '</div>';
  }

  var html = '<div class="gallery">' + imgs + '</div>';

  html += '<div class="card">';
  html += '<div class="name">' + escapeHtml(title) + ' <span class="role-badge">' + getRoleIcon(r) + ' ' + getRoleName(r) + '</span></div>';

  // 通用字段
  if (item.phone) {
    html += '<div class="field"><b>联系电话：</b><a href="tel:' + escapeHtml(item.phone) + '" style="color:#2E7D32;text-decoration:none;">' + escapeHtml(item.phone) + ' 📞</a></div>';
  }
  html += '<div class="field"><b>所在地区：</b>' + escapeHtml(getLocation(item)) + '</div>';

  // 角色特定字段
  if (r === 'technician') {
    if (item.price) html += '<div class="field"><b>服务价格：</b><span class="price-big">¥' + escapeHtml(item.price) + '</span> / 次</div>';
    if (item.services && item.services.length) {
      html += '<div class="field"><b>服务项目：</b></div><div class="services-box">' + escapeHtml(item.services.filter(Boolean).join('、')) + '</div>';
    }
  } else if (r === 'village_head') {
    if (item.description) html += '<div class="field"><b>村庄介绍：</b><div style="background:#fff3f6;padding:10px;border-radius:8px;margin-top:6px;white-space:pre-wrap;line-height:1.6;">' + escapeHtml(item.description) + '</div></div>';
  } else if (r === 'villager') {
    if (item.age) html += '<div class="field"><b>年龄：</b>' + escapeHtml(item.age) + '岁</div>';
    if (item.gender) html += '<div class="field"><b>性别：</b>' + escapeHtml(item.gender) + '</div>';
    if (item.products && item.products.length) {
      html += '<div class="field"><b>农产品售卖：</b><div class="tag-list">';
      item.products.forEach(function(p) { html += '<span class="tag">🌾 ' + escapeHtml(p.name || '') + (p.price ? ' ¥' + escapeHtml(p.price) : '') + '</span>'; });
      html += '</div></div>';
    }
    if (item.crafts && item.crafts.length) {
      html += '<div class="field"><b>手工制作：</b><div class="tag-list">';
      item.crafts.forEach(function(c) { html += '<span class="tag">🪵 ' + escapeHtml(c.name || '') + (c.price ? ' ¥' + escapeHtml(c.price) : '') + '</span>'; });
      html += '</div></div>';
    }
    if (item.skills && item.skills.length) {
      html += '<div class="field"><b>功能技能：</b><div class="tag-list">';
      item.skills.forEach(function(s) { html += '<span class="tag">' + escapeHtml(s) + '</span>'; });
      html += '</div></div>';
    }
    if (item.jobStatus) html += '<div class="field"><b>求职状态：</b>' + escapeHtml(item.jobStatus) + '</div>';
  } else if (r === 'supermarket') {
    if (item.demands && item.demands.length) {
      html += '<div class="field"><b>商品需求：</b>';
      item.demands.forEach(function(d, i) { html += '<div style="margin-top:4px;padding:8px;background:#f9f9f9;border-radius:6px;white-space:pre-wrap;">' + escapeHtml(d) + '</div>'; });
      html += '</div>';
    }
  } else if (r === 'market') {
    if (item.houseNumber) html += '<div class="field"><b>门牌号：</b>' + escapeHtml(item.houseNumber) + '</div>';
    if (item.description) html += '<div class="field"><b>农产品需求：</b><div style="background:#fff3f6;padding:10px;border-radius:8px;margin-top:6px;white-space:pre-wrap;">' + escapeHtml(item.description) + '</div></div>';
  } else if (r === 'factory') {
    if (item.factoryName) html += '<div class="field"><b>工厂名称：</b>' + escapeHtml(item.factoryName) + '</div>';
    if (item.product) html += '<div class="field"><b>产品方向：</b>' + escapeHtml(item.product) + '</div>';
    if (item.jobs && item.jobs.length) {
      html += '<div class="field"><b>招工岗位：</b>';
      item.jobs.forEach(function(j) { html += '<div style="margin-top:4px;padding:8px;background:#f0f9f0;border-radius:6px;">' + escapeHtml(j.title || '') + (j.salary ? ' → ' + escapeHtml(j.salary) : '') + '</div>'; });
      html += '</div>';
    }
    if (item.farmDemand) html += '<div class="field"><b>农产品需求：</b><div style="background:#fff3f6;padding:10px;border-radius:8px;margin-top:6px;white-space:pre-wrap;">' + escapeHtml(item.farmDemand) + '</div></div>';
  } else if (r === 'customer_service') {
    if (item.age) html += '<div class="field"><b>年龄：</b>' + escapeHtml(item.age) + '岁</div>';
    if (item.serviceArea) html += '<div class="field"><b>服务区域：</b>' + escapeHtml(item.serviceArea) + '</div>';
  } else if (r === 'sales_manager') {
    if (item.age) html += '<div class="field"><b>年龄：</b>' + escapeHtml(item.age) + '岁</div>';
    if (item.serviceArea) html += '<div class="field"><b>销售区域：</b>' + escapeHtml(item.serviceArea) + '</div>';
    if (item.linkedAgents) html += '<div class="field"><b>已对接代理：</b>' + escapeHtml(item.linkedAgents) + '</div>';
  } else if (r === 'village_agent') {
    if (item.developedCount !== undefined) html += '<div class="field"><b>已发展人员：</b>' + item.developedCount + ' 人</div>';
  } else if (r === 'town_agent' || r === 'county_agent') {
    if (item.developedCount !== undefined) html += '<div class="field"><b>已发展人员：</b>' + item.developedCount + ' 人</div>';
    if (item.developedFactoriesCount !== undefined) html += '<div class="field"><b>已发展公司工厂：</b>' + item.developedFactoriesCount + ' 家</div>';
    if (item.factories && item.factories.length) {
      html += '<div class="field"><b>公司/工厂列表：</b><div class="tag-list">';
      item.factories.forEach(function(fi) { html += '<span class="tag">' + escapeHtml(fi.name || '') + '</span>'; });
      html += '</div></div>';
    }
  }

  html += '</div>';

  document.getElementById('content').innerHTML = html;

  // 底部拨打电话
  var callBar = document.getElementById('callBar');
  if (item.phone) {
    callBar.style.display = 'block';
    callBar.innerHTML = '<a href="tel:' + escapeHtml(item.phone) + '" class="tel-link">📞 拨打电话 ' + escapeHtml(item.phone) + '</a>';
  } else {
    callBar.style.display = 'none';
  }
}

function matchItem(item, id) {
  return item && (item.id === id || item.accountId === id || item.account === id);
}

(function() {
  var type = getParam('type') || 'technician';
  var id = getParam('id') || getParam('accountId') || getParam('account');

  if (!id) {
    document.getElementById('content').innerHTML = '<div class="loading">加载中...</div>';
    var binKey = ROLE_CONFIG[type] ? ROLE_CONFIG[type].bin : 'technicians';
    JB.get(binKey, function(list) {
      if (!Array.isArray(list)) list = [];
      var passed = list.filter(function(t) { return t && t.status === '已通过'; });
      if (passed.length === 0) {
        document.getElementById('content').innerHTML = '<div class="empty">暂无数据<br><br><a href="index.html" style="color:#C2185B;text-decoration:none;">← 返回首页</a></div>';
        return;
      }
      var html = '<div style="padding:10px 0 4px;color:#C2185B;font-weight:bold;margin-bottom:8px;">请选择：</div>';
      passed.forEach(function(t) {
        var key = t.id || t.accountId || t.account || '';
        var r = t.role || type;
        html += '<div class="card" style="cursor:pointer;" onclick="location.href=\'technician-detail.html?v=20260916&type=' + encodeURIComponent(r) + '&id=' + encodeURIComponent(key) + '\'">' +
          '<div style="font-weight:bold;color:#C2185B;font-size:15px;">' + getRoleIcon(r) + ' ' + escapeHtml(getItemTitle(t)) + ' <span class="role-badge">' + getRoleName(r) + '</span></div>' +
          (t.phone ? '<div style="font-size:13px;color:#888;margin-top:4px;">📞 ' + escapeHtml(t.phone) + '</div>' : '') +
          '<div style="font-size:13px;color:#888;">📍 ' + escapeHtml(getLocation(t)) + '</div>' +
          '</div>';
      });
      document.getElementById('content').innerHTML = '<div class="card" style="background:#fff3f6;margin-bottom:16px;padding:12px;font-size:13px;color:#C2185B;">请选择要查看的 ' + getRoleName(type) + '（共 ' + passed.length + ' 条）</div>' + html;
    });
    return;
  }

  // 先本地快速展示
  var binKey = ROLE_CONFIG[type] ? ROLE_CONFIG[type].bin : 'technicians';
  var local = JB._getLocal(binKey);
  var found = null;
  for (var i = 0; i < local.length; i++) {
    if (matchItem(local[i], id) && local[i].status === '已通过') { found = local[i]; break; }
  }
  if (found) render(found);

  // 从云端拉取更新
  JB.get(binKey, function(list) {
    if (!Array.isArray(list)) return;
    for (var j = 0; j < list.length; j++) {
      if (matchItem(list[j], id) && list[j].status === '已通过') {
        var cloud = list[j];
        if (!found || JSON.stringify(found) !== JSON.stringify(cloud)) {
          render(cloud);
        }
        break;
      }
    }
  });
})();
  </script>
<script src="cloud-config.js"></script>
<script src="cloud-api.js"></script>
</body>
</html>
